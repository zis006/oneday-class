<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>원데이 클래스 동아리</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F4F4F7;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
input,textarea,button,select{font-family:inherit}
img{max-width:100%}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#D7D2EA;border-radius:4px}
.shell{max-width:560px;margin:0 auto;min-height:100vh}
.nav{background:#fff;position:sticky;top:0;z-index:100}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 12px}
.nav-tabs{display:flex;gap:18px;padding:0 20px}
.nav-tab{background:none;border:none;padding:0 0 12px;font-size:15px;font-weight:800;color:#C4C4CC;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav-tab.on{color:#1B1B22;border-bottom-color:#6C5CE7}
.main{padding:18px 16px 40px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 8px}
.sec-t{font-size:15px;font-weight:800;color:#1B1B22}
.divider{height:1px;background:#EFEFF3;margin:12px 0}
.card-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.home-grid{display:grid;grid-template-columns:1fr;gap:0}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto}
.sticky-add{position:sticky;bottom:0;padding:16px 0 4px;background:linear-gradient(to top,#F4F4F7 70%,rgba(244,244,247,0))}

/* ── 태블릿 이상 ─────────────────────────────────────────── */
@media(min-width:768px){
  .shell{max-width:100%}
  .nav-in{max-width:1120px;margin:0 auto;padding:20px 32px 14px}
  .nav-tabs{max-width:1120px;margin:0 auto;padding:0 32px;gap:26px}
  .nav-tab{font-size:16px}
  .main{max-width:1120px;margin:0 auto;padding:28px 32px 64px}
  .card-grid{grid-template-columns:repeat(2,1fr);gap:16px}
  /* 모바일 DOM 순서(다가오는→투표→소감)는 유지한 채 데스크톱만 2단 배치 */
  .home-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;align-items:start}
  .home-grid>.sec:nth-child(1){grid-column:1;grid-row:1}
  .home-grid>.sec:nth-child(2){grid-column:2;grid-row:1/span 2}
  .home-grid>.sec:nth-child(3){grid-column:1;grid-row:2}
  .detail-wrap{max-width:760px;margin:0 auto}
  .photo-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .sec-t{font-size:16px}
  .modal-back{align-items:center;padding:24px}
  .modal-box{border-radius:18px;max-width:600px;max-height:86vh}
  .sticky-add{display:flex;justify-content:center}
  .sticky-add>button{max-width:340px}
}

/* ── 데스크톱 ────────────────────────────────────────────── */
@media(min-width:1200px){
  .card-grid{grid-template-columns:repeat(3,1fr)}
  .photo-grid{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ═══════════════════════════════════════════════════════════════
   🔥 Firebase 설정
═══════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCsU4kItKc3hytFBmyiGUMRqYwf_9isTBs",
  authDomain:        "oneday-class-f1396.firebaseapp.com",
  projectId:         "oneday-class-f1396",
  storageBucket:     "oneday-class-f1396.firebasestorage.app",
  messagingSenderId: "563875409178",
  appId:             "1:563875409178:web:7f9bf95f4adf808d2d50a3",
  measurementId:     "G-V85BRDYE24"
};

let db = null;
const CONFIGURED = FIREBASE_CONFIG.apiKey !== "여기에_붙여넣기";
if (CONFIGURED) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  } catch(e) { console.warn('Firebase 초기화 실패:', e); }
}

/* ── Cloudinary ──────────────────────────────────────────────── */
const CLOUDINARY_CLOUD = 'r9jlchwx';
const CLOUDINARY_PRESET = 'oneday-class';
const DOC = () => db && db.collection('od_club').doc('shared');

async function fbGet(){
  if(!db){try{return JSON.parse(localStorage.getItem('od_shared')||'{}');}catch{return {};}}
  try{const s=await DOC().get();return s.exists?s.data():{};}catch{return {};}
}
async function fbSet(key,val){
  if(!db){const cur=JSON.parse(localStorage.getItem('od_shared')||'{}');localStorage.setItem('od_shared',JSON.stringify({...cur,[key]:val}));return;}
  try{await DOC().set({[key]:val},{merge:true});}catch(e){console.error(e);}
}
function fbListen(cb){
  if(!db)return()=>{};
  return DOC().onSnapshot(s=>{if(s.exists)cb(s.data());});
}

/* ── 사진 업로드 ─────────────────────────────────────────────── */
async function uploadPhoto(file) {
  if(file.size > 10*1024*1024){alert('10MB 이하 사진만 올릴 수 있어요');return null;}
  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {method:'POST', body: form});
    const data = await res.json();
    if(data.secure_url) return data.secure_url;
    throw new Error(data.error?.message || '업로드 실패');
  } catch(e) {
    console.error(e);
    alert('사진 업로드 실패: ' + e.message);
    return null;
  }
}

/* ── 지도 링크 (네이버 / 카카오) ─────────────────────────────── */
const isKakaoUrl = u => /kakao\.com|kko\.kr/i.test(u||'');
const isNaverUrl = u => /naver\.me|naver\.com/i.test(u||'');
const isMapUrl   = u => isKakaoUrl(u) || isNaverUrl(u);

// 구버전(naverUrl 한 칸에 카카오 링크가 들어간 경우)까지 흡수
function getLinks(o){
  const urls=[o.naverUrl,o.kakaoUrl,o.url].filter(Boolean);
  return {naverUrl:urls.find(isNaverUrl)||'', kakaoUrl:urls.find(isKakaoUrl)||''};
}

function pickAddress(text){
  if(!text) return '';
  const t=text.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();
  const m=t.match(/(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충청|충북|충남|전라|전북|전남|경상|경북|경남|제주)[^|·\n]{4,60}/);
  return m?m[0].trim().replace(/[,.]$/,''):t.slice(0,60);
}

async function fetchPlaceInfo(url){
  if(!isMapUrl(url)) return null;
  try{
    const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res=await fetch(proxy,{signal:AbortSignal.timeout(8000)});
    const data=await res.json();
    const html=data.contents||'';
    const getOG=prop=>{
      const m=html.match(new RegExp(`<meta[^>]*property="${prop}"[^>]*content="([^"]+)"`,'i'))||
              html.match(new RegExp(`<meta[^>]*content="([^"]+)"[^>]*property="${prop}"`,'i'));
      return m?m[1].replace(/&amp;/g,'&').replace(/&#39;/g,"'"):'';
    };
    const name=(getOG('og:title')||'').split(/\s*[|:]\s*/)[0].trim();
    const address=pickAddress(getOG('og:description'));
    return name?{name,address}:null;
  }catch(e){console.warn('장소 정보 가져오기 실패:',e);return null;}
}

/* ── Nickname ────────────────────────────────────────────────── */
const getNick  = () => localStorage.getItem('od_nick')||'';
const saveNick = v  => localStorage.setItem('od_nick', v);

/* ── Utilities ───────────────────────────────────────────────── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const WD=['일','월','화','수','목','금','토'];
const CATS=['도예','요리','베이킹','공예','그림','플라워','캘리','가죽','기타'];
const CE={도예:'🏺',요리:'🍳',베이킹:'🥐',공예:'✂️',그림:'🎨',플라워:'💐',캘리:'✒️',가죽:'👜',기타:'✨'};

/* 투표 5단계 · 득표수 = 가중 점수 합계 */
const VOPTS=[
  {k:'당장',    label:'당장 하고싶어요',        e:'🔥', score: 2, color:'#E53E3E'},
  {k:'언젠가',  label:'하고싶어요',            e:'👍', score: 1, color:'#6C5CE7'},
  {k:'보통',    label:'해도그만 안해도 그만',   e:'😐', score: 0, color:'#64748B'},
  {k:'안함',    label:'안하고 싶어요',          e:'🙅', score:-1, color:'#D97706'},
  {k:'절대안함',label:'절대 안하고 싶어요',      e:'❌', score:-2, color:'#94A3B8'},
];
const VMAP={};VOPTS.forEach(o=>{VMAP[o.k]=o;});
const calcScore=c=>Object.values(c.votes||{}).reduce((s,v)=>s+(VMAP[v]?VMAP[v].score:0),0);
const voterCount=c=>Object.keys(c.votes||{}).length;

function nthWkday(year,month,wday,n){
  const base=new Date(year,month,1);const[y,m]=[base.getFullYear(),base.getMonth()];let c=0;
  for(let d=1;d<=31;d++){const dt=new Date(y,m,d);if(dt.getMonth()!==m)break;if(dt.getDay()===wday&&++c===n)return dt;}
  return null;
}
function getNextClassDate(){const now=new Date();const[y,m]=[now.getFullYear(),now.getMonth()];const cur=nthWkday(y,m,3,2);return(cur&&cur>now)?cur:nthWkday(y,m+1,3,2);}
const toISO=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const toYM=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:'';
const ymLabel=ym=>{if(!ym)return'';const[y,m]=ym.split('-');return`${y}년 ${String(+m).padStart(2,'0')}월`;};
const fmtDot=d=>d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${WD[d.getDay()]})`:'';
// 구버전은 date가 "2026년 5월 28일 (목)" 문자열로 저장돼 있어 ISO로 정규화
const toISODate=d=>{
  if(!d)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  const m=String(d).match(/(\d{4})[년.\-\/]\s*(\d{1,2})[월.\-\/]\s*(\d{1,2})/);
  return m?`${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`:'';
};
const displayDate=d=>{
  const iso=toISODate(d);
  return iso?fmtDot(new Date(iso+'T00:00:00')):(d||'');
};
const daysUntil=d=>{const a=new Date();a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/86400000);};
const won=n=>`${Number(n||0).toLocaleString()}원`;

/* ── 뒷풀이 정규화 ───────────────────────────────────────────── */
const PARTY_DEFAULTS={name:'',address:'',naverUrl:'',kakaoUrl:'',menu:'',photos:[],review:''};
const newParty=()=>({id:uid(),...PARTY_DEFAULTS});
function getAfterParties(rec){
  const raw=(rec.afterParties&&rec.afterParties.length>0)
    ? rec.afterParties
    : (rec.afterPartyName||rec.afterPartyAddress)
      ? [{id:'legacy',name:rec.afterPartyName||'',address:rec.afterPartyAddress||'',url:rec.afterPartyUrl||''}]
      : [];
  return raw.map(p=>({...PARTY_DEFAULTS,...p,...getLinks(p),photos:p.photos||[]}));
}

/* ── 활동 소감 정규화 (구버전 리뷰 흡수) ─────────────────────── */
function getImpressions(rec){
  const norm=i=>({id:i.id,author:i.author,text:i.text||'',rating:i.rating||0,photo:i.photo||null,likes:i.likes||[],createdAt:i.createdAt||0});
  return [...(rec.impressions||[]).map(norm),...(rec.reviews||[]).map(norm)].sort((a,b)=>b.createdAt-a.createdAt);
}
function impAvg(list){
  const rated=list.filter(i=>i.rating>0);
  return rated.length?(rated.reduce((s,i)=>s+i.rating,0)/rated.length).toFixed(1):null;
}
const recDateKey=r=>toISODate(r.date)||`${r.month||''}-00`;

/* ── Base styles ─────────────────────────────────────────────── */
const IS={border:'1.5px solid #E4E4EC',borderRadius:10,padding:'10px 12px',fontSize:14,width:'100%',boxSizing:'border-box',outline:'none',fontFamily:'inherit',color:'#1B1B22',background:'#FAFAFC'};
const CS={background:'#fff',borderRadius:14,padding:16,boxShadow:'0 1px 3px rgba(0,0,0,.04)'};

/* ── UI atoms ────────────────────────────────────────────────── */
function FI({label,...p}){return <div style={{display:'flex',flexDirection:'column',gap:5}}>{label&&<label style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>{label}</label>}<input style={IS} {...p}/></div>;}
function FT({label,rows=3,...p}){return <div style={{display:'flex',flexDirection:'column',gap:5}}>{label&&<label style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>{label}</label>}<textarea style={{...IS,resize:'none'}} rows={rows} {...p}/></div>;}
function Btn({children,v='pri',sx={},...p}){
  const V={
    pri:{background:'#6C5CE7',color:'#fff',border:'none'},
    dark:{background:'#5A5A66',color:'#fff',border:'none'},
    ghost:{background:'#F1EFFE',color:'#6C5CE7',border:'none'},
    gray:{background:'#F1F1F5',color:'#64748B',border:'none'},
    out:{background:'#fff',color:'#6C5CE7',border:'1.5px solid #DED8FB'},
    amber:{background:'#FFFBEB',color:'#B45309',border:'1.5px solid #FDE68A'},
  };
  return <button style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,borderRadius:10,padding:'11px 18px',fontSize:14,fontWeight:700,cursor:'pointer',...(V[v]||V.pri),...sx}} {...p}>{children}</button>;
}
function SmallBtn({children,sx={},...p}){
  return <button style={{background:'#F1F1F5',border:'none',borderRadius:20,padding:'5px 12px',fontSize:12,fontWeight:700,color:'#5A5A66',cursor:'pointer',fontFamily:'inherit',...sx}} {...p}>{children}</button>;
}
function Stars({value=0,onChange,size=16}){
  return <div style={{display:'flex',gap:1}}>{[1,2,3,4,5].map(i=>
    <button key={i} onClick={()=>onChange?.(i)} style={{background:'none',border:'none',cursor:onChange?'pointer':'default',padding:0,lineHeight:0}}>
      <svg width={size} height={size} viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill={i<=value?'#2D2D35':'none'} stroke={i<=value?'#2D2D35':'#D1D1DA'} strokeWidth="1.5" strokeLinejoin="round"/></svg>
    </button>)}</div>;
}
function Chip({cat}){
  if(!cat)return null;
  return <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:12,color:'#5A5A66',fontWeight:600}}><span style={{fontSize:13}}>{CE[cat]}</span>{cat}</span>;
}
function MonthBadge({ym,sx={}}){
  if(!ym)return null;
  return <span style={{fontSize:11,background:'#EEEBFD',color:'#6C5CE7',borderRadius:20,padding:'3px 10px',fontWeight:700,...sx}}>{ymLabel(ym)}</span>;
}
function Modal({title,onClose,children}){
  return <div className="modal-back" onClick={e=>{if(e.target===e.currentTarget&&onClose)onClose();}}>
    <div className="modal-box">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:'1px solid #EFEFF3',position:'sticky',top:0,background:'#fff',zIndex:1}}>
        <span style={{fontWeight:800,fontSize:16,color:'#1B1B22'}}>{title}</span>
        {onClose&&<button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'#BFBFC8',fontSize:26,lineHeight:1,padding:4}}>×</button>}
      </div>
      <div style={{padding:'18px 20px 32px'}}>{children}</div>
    </div>
  </div>;
}
function Empty({title,sub,action}){
  return <div style={{textAlign:'center',padding:'26px 16px'}}>
    <div style={{fontSize:13,color:'#8A8A96',lineHeight:1.7,whiteSpace:'pre-line'}}>{title}{sub?`\n${sub}`:''}</div>
    {action&&<div style={{marginTop:14}}>{action}</div>}
  </div>;
}
function SortToggle({desc,onToggle}){
  return <button onClick={onToggle} style={{background:'none',border:'none',cursor:'pointer',fontSize:12,fontWeight:700,color:'#8A8A96',fontFamily:'inherit',display:'inline-flex',alignItems:'center',gap:3}}>{desc?'최신순':'오래된순'} ⇅</button>;
}

/* ── 지도 아이콘 (주소 옆) ───────────────────────────────────── */
function MapIcons({naverUrl,kakaoUrl}){
  const base={display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:22,borderRadius:6,fontSize:11,fontWeight:900,textDecoration:'none',flexShrink:0};
  return <React.Fragment>
    {naverUrl&&<a href={naverUrl} target="_blank" rel="noopener noreferrer" title="네이버 지도" style={{...base,background:'#03C75A',color:'#fff'}}>N</a>}
    {kakaoUrl&&<a href={kakaoUrl} target="_blank" rel="noopener noreferrer" title="카카오맵" style={{...base,background:'#FEE500',color:'#3C1E1E'}}>K</a>}
  </React.Fragment>;
}
function AddressRow({address,naverUrl,kakaoUrl}){
  if(!address&&!naverUrl&&!kakaoUrl)return null;
  return <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
    <span style={{fontSize:14,color:'#3A3A44'}}>{address||'주소 미입력'}</span>
    <MapIcons naverUrl={naverUrl} kakaoUrl={kakaoUrl}/>
  </div>;
}

/* ── 장소 입력 (네이버·카카오 링크 + 주소) ───────────────────── */
function PlaceFields({v,onChange,onName}){
  const [fetching,setFetching]=useState(false);
  async function handle(key,url){
    onChange({...v,[key]:url});
    if(!isMapUrl(url))return;
    setFetching(true);
    const info=await fetchPlaceInfo(url);
    if(info){
      onChange({...v,[key]:url,address:v.address||info.address});
      if(onName) onName(info.name);
    }
    setFetching(false);
  }
  return(
    <div style={{border:'1.5px solid #E9E9F0',borderRadius:12,padding:14,background:'#FAFAFC',display:'flex',flexDirection:'column',gap:10}}>
      <div style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>📍 장소 <span style={{fontWeight:400,color:'#9A9AA6'}}>링크를 넣으면 주소가 자동 입력돼요</span></div>
      <FI label="네이버 지도 링크" value={v.naverUrl||''} onChange={e=>handle('naverUrl',e.target.value)} placeholder="https://naver.me/..."/>
      <FI label="카카오맵 링크" value={v.kakaoUrl||''} onChange={e=>handle('kakaoUrl',e.target.value)} placeholder="https://kko.kr/..."/>
      <FI label="주소" value={v.address||''} onChange={e=>onChange({...v,address:e.target.value})} placeholder="서울시 마포구 ... (직접 입력 가능)"/>
      {fetching&&<div style={{fontSize:12,color:'#6C5CE7'}}>⏳ 장소 정보 불러오는 중...</div>}
    </div>
  );
}

/* ── 사진 ────────────────────────────────────────────────────── */
function PhotoUploadBtn({onUpload,uploading,label='+ 사진 추가',multiple=true}){
  async function handle(e){
    const files=Array.from(e.target.files||[]);
    e.target.value='';
    for(const file of files) await onUpload(file);
  }
  return(
    <label style={{display:'inline-flex',alignItems:'center',gap:5,borderRadius:20,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',background:'#F1F1F5',color:'#5A5A66',userSelect:'none'}}>

/* ── 다녀온 상세 ─────────────────────────────────────────────── */
function RecordDetail({rec,onUpdate,nick,openImp}){
  const [showEdit,setShowEdit]=useState(false);
  const [showImpForm,setShowImpForm]=useState(!!openImp);
  const [partyDraft,setPartyDraft]=useState(null);
  const [uploadingPhoto,setUploadingPhoto]=useState(false);

  const impressions=getImpressions(rec);
  const photos=rec.photos||[];
  const afterParties=getAfterParties(rec);
  const links=getLinks(rec);

  function update(changes){onUpdate({...rec,...changes});}

  const photosRef=useRef(photos);
  useEffect(()=>{photosRef.current=rec.photos||[];},[rec.photos]);
  async function handlePhotoUpload(file){
    setUploadingPhoto(true);
    const url=await uploadPhoto(file);
    if(url){
      const next=[...photosRef.current,url];
      photosRef.current=next;
      update({photos:next,thumb:rec.thumb||next[0]});
    }
    setUploadingPhoto(false);
    return url;
  }
  function deletePhoto(i){
    if(!confirm('이 사진을 삭제할까요?'))return;
    const removed=photos[i];
    const next=photos.filter((_,idx)=>idx!==i);
    update({photos:next,thumb:rec.thumb===removed?(next[0]||''):(rec.thumb||'')});
  }

  // 소감: impressions / 구버전 reviews 양쪽 모두 반영
  function patchImp(id,fn){
    update({
      impressions:(rec.impressions||[]).map(i=>i.id===id?fn(i):i),
      reviews:(rec.reviews||[]).map(i=>i.id===id?fn(i):i),
    });
  }
  function addImpression(imp){update({impressions:[...(rec.impressions||[]),imp],isStub:false});setShowImpForm(false);}
  function delImpression(id){
    if(!confirm('삭제할까요?'))return;
    update({impressions:(rec.impressions||[]).filter(x=>x.id!==id),reviews:(rec.reviews||[]).filter(x=>x.id!==id)});
  }
  function likeImp(id){
    if(!nick.trim()){alert('닉네임을 먼저 설정해주세요 (우측 상단)');return;}
    patchImp(id,i=>{
      const likes=i.likes||[];
      return {...i,likes:likes.includes(nick)?likes.filter(n=>n!==nick):[...likes,nick]};
    });
  }

  // 뒷풀이
  const draftIsNew=partyDraft&&!afterParties.some(x=>x.id===partyDraft.id);
  function saveParty(){
    const p=partyDraft;
    if(!p.name.trim()&&!p.address.trim()){alert('장소명이나 주소를 입력해주세요');return;}
    update({afterParties:draftIsNew?[...afterParties,p]:afterParties.map(x=>x.id===p.id?p:x)});
    setPartyDraft(null);
  }
  function delParty(id){
    if(!confirm('이 뒷풀이 장소를 삭제할까요?'))return;
    update({afterParties:afterParties.filter(x=>x.id!==id)});
  }

  return(
    <React.Fragment>
      {/* 기본 정보 */}
      <div style={{...CS,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}><MonthBadge ym={rec.month}/><Chip cat={rec.cat}/></div>
          <SmallBtn onClick={()=>setShowEdit(true)}>✏️ 수정</SmallBtn>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {rec.date&&<div style={{fontSize:14,color:'#3A3A44'}}><b style={{fontWeight:700}}>날짜:</b> {displayDate(rec.date)}</div>}
          <div style={{fontSize:14,color:'#3A3A44'}}><b style={{fontWeight:700}}>금액:</b> {won(rec.price)}</div>
          <AddressRow address={rec.address} naverUrl={links.naverUrl} kakaoUrl={links.kakaoUrl}/>
          {rec.activity&&<div style={{marginTop:3}}>
            <div style={{fontSize:14,fontWeight:700,color:'#1B1B22',marginBottom:5}}>활동 내용</div>
            <div style={{fontSize:13,color:'#5A5A66',lineHeight:1.7,whiteSpace:'pre-line'}}>{rec.activity}</div>
          </div>}
        </div>
      </div>

      {/* 활동 사진 */}
      <div style={{...CS,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <span style={{fontSize:14,fontWeight:800,color:'#1B1B22'}}>활동 사진 ({photos.length}장)</span>
          <PhotoUploadBtn onUpload={handlePhotoUpload} uploading={uploadingPhoto}/>
        </div>
        {photos.length===0
          ?<div style={{fontSize:13,color:'#A6A6B2',textAlign:'center',padding:'14px 0'}}>사진을 올려보세요</div>
          :<React.Fragment>
            <PhotoGrid photos={photos} onDelete={deletePhoto} thumb={rec.thumb} onSetThumb={u=>update({thumb:u})}/>
            <div style={{fontSize:11,color:'#A6A6B2',marginTop:8}}>☐ 대표를 체크하면 목록 썸네일이 돼요</div>

      </div>

      {/* 활동 소감 */}

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:showImpForm?12:4}}>

          {!showImpForm&&<SmallBtn onClick={()=>setShowImpForm(true)}>소감 남기기</SmallBtn>}
        </div>
        {showImpForm&&<div style={{marginBottom:impressions.length?4:0}}><ImpressionForm nick={nick} onSubmit={addImpression} onCancel={()=>setShowImpForm(false)}/></div>}
        {impressions.length===0&&!showImpForm
          ?<div style={{fontSize:13,color:'#A6A6B2',textAlign:'center',padding:'14px 0'}}>첫 소감을 남겨주세요!</div>
          :impressions.map((imp,i)=>(
            <div key={imp.id}>{i>0||showImpForm?<div className="divider"/>:null}
              <ImpressionItem imp={imp} nick={nick} onLike={likeImp} onDelete={delImpression} compact/>
            </div>
          ))}
      </div>

      {/* 뒷풀이 */}
      {afterParties.map((p,i)=>(
        partyDraft&&partyDraft.id===p.id
          ?<div key={p.id} style={{marginBottom:10}}>
            <PartyEditor p={partyDraft} index={i+1} onChange={setPartyDraft}/>
            <div style={{display:'flex',gap:8,marginTop:8}}><Btn sx={{flex:1}} onClick={saveParty}>저장</Btn><Btn v="gray" onClick={()=>setPartyDraft(null)}>취소</Btn></div>
          </div>
          :<PartyCard key={p.id||i} p={p} index={i+1} onEdit={()=>setPartyDraft({...p})} onDelete={()=>delParty(p.id)}/>
      ))}
      {draftIsNew&&<div style={{marginBottom:10}}>
        <PartyEditor p={partyDraft} index={afterParties.length+1} onChange={setPartyDraft}/>
        <div style={{display:'flex',gap:8,marginTop:8}}><Btn sx={{flex:1}} onClick={saveParty}>추가</Btn><Btn v="gray" onClick={()=>setPartyDraft(null)}>취소</Btn></div>
      </div>}
      {!partyDraft&&<Btn sx={{width:'100%',marginTop:4}} onClick={()=>setPartyDraft(newParty())}>+ 뒷풀이 장소 추가</Btn>}

      {showEdit&&<EditRecordModal rec={rec} onSave={u=>{onUpdate(u);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </React.Fragment>
  );
}

function CandidatesTab({candidates,confirmed,onSave,go,openAdd,onAddClosed}){

  const [showAdd,setShowAdd]=useState(false);
  useEffect(()=>{if(openAdd){setShowAdd(true);onAddClosed&&onAddClosed();}},[openAdd]);
  const ymOf={};Object.entries(confirmed||{}).forEach(([ym,id])=>{ymOf[id]=ym;});
  const sorted=[...candidates].sort((a,b)=>desc?(b.addedAt||0)-(a.addedAt||0):(a.addedAt||0)-(b.addedAt||0));
  return(
    <div style={{minHeight:'calc(100vh - 200px)',display:'flex',flexDirection:'column'}}>
      <div className="sec-h" style={{marginBottom:12}}>
        <span className="sec-t">총 {candidates.length}개</span>
        <SortToggle desc={desc} onToggle={()=>setDesc(d=>!d)}/>

      <div style={{flex:1}}>
        {sorted.length===0
          ?<div style={CS}><Empty title="아직 후보가 없어요." sub="체험하고 싶은 클래스를 추가해보세요!"/></div>
          :<div className="card-grid">
            {sorted.map(c=>(
              <div key={c.id} onClick={()=>go({t:'cand',id:c.id})} style={{...CS,cursor:'pointer'}}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
                  <Chip cat={c.cat}/>
                  {ymOf[c.id]&&<MonthBadge ym={ymOf[c.id]}/>}
                </div>
                <div style={{fontSize:16,fontWeight:800,color:'#1B1B22',margin:'6px 0 8px'}}>{c.name}</div>
                <div style={{fontSize:13,color:'#5A5A66',marginBottom:4}}>💰 {won(c.price)}</div>
                <div style={{fontSize:13,color:'#5A5A66'}}>👍 추천수 {calcScore(c)}개 <span style={{color:'#A6A6B2'}}>· {voterCount(c)}명 참여</span></div>

  );

function CandidateDetail({cand,onUpdate,nick}){
  const [showEdit,setShowEdit]=useState(false);
  const myVote=cand.votes?.[nick]||null;
  const links=getLinks(cand);
  function castVote(key){
    if(!nick.trim()){alert('닉네임을 먼저 설정해주세요 (우측 상단)');return;}
    onUpdate({...cand,votes:{...(cand.votes||{}),[nick.trim()]:key}});
  }
  return(
    <React.Fragment>
      <div style={{...CS,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <Chip cat={cand.cat}/>
          <SmallBtn onClick={()=>setShowEdit(true)}>✏️ 수정</SmallBtn>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          <div style={{fontSize:14,color:'#3A3A44'}}><b style={{fontWeight:700}}>금액:</b> {won(cand.price)}</div>
          <AddressRow address={cand.address} naverUrl={links.naverUrl} kakaoUrl={links.kakaoUrl}/>
          {cand.activity&&<div style={{marginTop:3}}>
            <div style={{fontSize:14,fontWeight:700,color:'#1B1B22',marginBottom:5}}>활동 내용</div>
            <div style={{fontSize:13,color:'#5A5A66',lineHeight:1.7,whiteSpace:'pre-line'}}>{cand.activity}</div>
          </div>}
          {cand.addedBy&&<div style={{fontSize:12,color:'#A6A6B2'}}>by {cand.addedBy}</div>}
        </div>
      </div>

      <div style={CS}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <span style={{fontSize:14,fontWeight:800,color:'#1B1B22'}}>투표</span>
          <span style={{fontSize:12,color:'#8A8A96',fontWeight:700}}>득표수 {calcScore(cand)} · {voterCount(cand)}명</span>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {VOPTS.map(o=>{
            const isMe=myVote===o.k;
            const voters=Object.entries(cand.votes||{}).filter(([,v])=>v===o.k).map(([k])=>k);
            return(
              <button key={o.k} onClick={()=>castVote(o.k)} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'12px 14px',borderRadius:10,cursor:'pointer',fontFamily:'inherit',textAlign:'left',border:isMe?`1.5px solid ${o.color}`:'1.5px solid #EFEFF3',background:isMe?'#FAFAFC':'#fff'}}>
                <span style={{fontSize:17,flexShrink:0}}>{o.e}</span>
                <span style={{flex:1,fontSize:14,fontWeight:isMe?800:600,color:isMe?o.color:'#3A3A44'}}>{o.label}</span>
                {voters.length>0&&<span style={{fontSize:12,color:'#8A8A96',fontWeight:700,flexShrink:0}}>{voters.length}명</span>}
              </button>
            );
          })}
        </div>
        {voterCount(cand)>0&&<div style={{marginTop:14,paddingTop:12,borderTop:'1px solid #EFEFF3'}}>
          {VOPTS.map(o=>{
            const vs=Object.entries(cand.votes||{}).filter(([,v])=>v===o.k).map(([k])=>k);
            return vs.length?<div key={o.k} style={{display:'flex',gap:6,marginBottom:5,fontSize:12,color:'#8A8A96'}}><span>{o.e}</span><span>{vs.join(', ')}</span></div>:null;
          })}
        </div>}
      </div>

      {showEdit&&<EditCandidateModal cand={cand} onSave={u=>{onUpdate(u);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </React.Fragment>
  );
}

function RecordFormBody({f,setF,photos,setPhotos,thumb,setThumb,afterParties,setAfterParties}){
  const [uploading,setUploading]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const photosRef=useRef(photos);
  useEffect(()=>{photosRef.current=photos;},[photos]);
  async function handlePhoto(file){
    setUploading(true);
    const url=await uploadPhoto(file);
    if(url){const next=[...photosRef.current,url];photosRef.current=next;setPhotos(next);setThumb(t=>t||url);}
    setUploading(false);
    return url;
  }
  function delPhoto(i){
    const removed=photos[i];const next=photos.filter((_,x)=>x!==i);
    setPhotos(next);if(thumb===removed)setThumb(next[0]||'');
  }
  return(
    <React.Fragment>
      <FI label="클래스 이름 *" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="예: 홍대 도자기 공방"/>
      <CatPicker value={f.cat} onChange={v=>set('cat',v)}/>
      <PlaceFields v={f} onChange={nv=>setF(p=>({...p,...nv}))} onName={n=>setF(p=>p.name?p:{...p,name:n})}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div><label style={{fontSize:12,fontWeight:700,color:'#6B7280',display:'block',marginBottom:5}}>날짜</label>
          <input type="date" value={f.date} onChange={e=>{const d=e.target.value;set('date',d);set('month',d.slice(0,7));}} style={IS}/></div>
        <FI label="금액 (1인, 원)" value={f.price} onChange={e=>set('price',e.target.value)} placeholder="45000" type="number"/>
      </div>
      <FT label="활동 내용" value={f.activity} onChange={e=>set('activity',e.target.value)} placeholder="어떤 활동을 했는지 적어주세요" rows={3}/>
      <div style={{border:'1.5px solid #E9E9F0',borderRadius:12,padding:14,background:'#FAFAFC'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <span style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>활동 사진</span>
          <PhotoUploadBtn onUpload={handlePhoto} uploading={uploading}/>
        </div>
        {photos.length>0
          ?<React.Fragment><PhotoGrid photos={photos} onDelete={delPhoto} thumb={thumb} onSetThumb={setThumb}/>
            <div style={{fontSize:11,color:'#A6A6B2',marginTop:8}}>☐ 대표를 체크하면 목록 썸네일이 돼요</div></React.Fragment>
          :<div style={{fontSize:12,color:'#A6A6B2'}}>여러 장 올릴 수 있어요</div>}
      </div>
      <div style={{border:'1.5px solid #E9E9F0',borderRadius:12,padding:14,background:'#FAFAFC'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <span style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>🍻 뒷풀이 장소</span>
          <SmallBtn onClick={()=>setAfterParties(p=>[...p,newParty()])}>+ 추가</SmallBtn>
        </div>
        {afterParties.length===0&&<div style={{fontSize:12,color:'#A6A6B2'}}>1차, 2차 장소를 추가하세요</div>}
        {afterParties.map((p,i)=>(
          <div key={p.id} style={{marginBottom:8}}>
            <PartyEditor p={p} index={i+1} onChange={np=>setAfterParties(a=>a.map(x=>x.id===np.id?np:x))} onRemove={()=>setAfterParties(a=>a.filter(x=>x.id!==p.id))}/>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

/* ═══════════════════ App ══════════════════════════════════════ */
const TABS=[{id:'home',l:'홈'},{id:'records',l:'다녀온'},{id:'candidates',l:'다음 활동 후보'}];
const isDetail=v=>v.t==='record'||v.t==='cand';

function App(){
  const [view,setView]=useState({t:'home'});
  const [candidates,setCandidates]=useState([]);
  const [records,setRecords]=useState([]);
  const [confirmed,setConfirmed]=useState({});
  const [nick,setNick]=useState(getNick());
  const [loading,setLoading]=useState(true);
  const [showNickModal,setShowNickModal]=useState(!getNick());
  const [editNick,setEditNick]=useState(false);
  const [pendingAdd,setPendingAdd]=useState(null);

  useEffect(()=>{
    async function init(){const data=await fbGet();setCandidates(data.candidates||[]);setRecords(data.records||[]);setConfirmed(data.confirmed||{});setLoading(false);}
    init();
    return fbListen(data=>{if(data.candidates)setCandidates(data.candidates);if(data.records)setRecords(data.records);if(data.confirmed)setConfirmed(data.confirmed);});
  },[]);

  useEffect(()=>{
    const onPop=()=>setView(v=>isDetail(v)?{t:v.t==='record'?'records':'candidates'}:v);
    window.addEventListener('popstate',onPop);
    return()=>window.removeEventListener('popstate',onPop);
  },[]);

  async function saveCands(data){setCandidates(data);await fbSet('candidates',data);}
  async function saveRecs(data){setRecords(data);await fbSet('records',data);}

  function go(next){
    if(next.add){setPendingAdd(next.t);setView({t:next.t});return;}
    if(isDetail(next)) window.history.pushState({},'');
    setView(next);
  }
  function back(){window.history.back();}

  if(loading)return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#A6A6B2',fontSize:14}}>불러오는 중...</div>;

  const rec=view.t==='record'?records.find(r=>r.id===view.id):null;
  const cand=view.t==='cand'?candidates.find(c=>c.id===view.id):null;
  const detailTitle=rec?rec.name:cand?cand.name:'';

  return(
    <div className="shell">
      <div className="nav">
        <div className="nav-in">
          {isDetail(view)
            ?<React.Fragment>
              <button onClick={back} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,color:'#1B1B22',padding:'0 8px 0 0',lineHeight:1}}>‹</button>
              <span style={{flex:1,fontSize:17,fontWeight:800,color:'#1B1B22',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{detailTitle}</span>
            </React.Fragment>
            :<span style={{flex:1,fontSize:20,fontWeight:800,color:'#1B1B22'}}>원데이 클래스 동아리</span>}
          <button onClick={()=>setEditNick(true)} title={nick||'닉네임 설정'}
            style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:nick?'#1B1B22':'#F59E0B',flexShrink:0,lineHeight:1}}>👤</button>
        </div>
        {!isDetail(view)&&<div className="nav-tabs">
          {TABS.map(t=><button key={t.id} className={`nav-tab${view.t===t.id?' on':''}`} onClick={()=>setView({t:t.id})}>{t.l}</button>)}
        </div>}
      </div>

      <div className="main">
        {view.t==='home'&&<HomeTab candidates={candidates} records={records} confirmed={confirmed} nick={nick} go={go}/>}
        {view.t==='records'&&<RecordsTab records={records} candidates={candidates} onSave={saveRecs} go={go}
          openAdd={pendingAdd==='records'} onAddClosed={()=>setPendingAdd(null)}/>}
        {view.t==='candidates'&&<CandidatesTab candidates={candidates} confirmed={confirmed} onSave={saveCands} go={go}
          openAdd={pendingAdd==='candidates'} onAddClosed={()=>setPendingAdd(null)}/>}
        {view.t==='record'&&<div className="detail-wrap">{rec
          ?<RecordDetail rec={rec} nick={nick} openImp={view.imp} onUpdate={u=>saveRecs(records.map(r=>r.id===u.id?u:r))}/>
          :<Empty title="기록을 찾을 수 없어요."/>}</div>}
        {view.t==='cand'&&<div className="detail-wrap">{cand
          ?<CandidateDetail cand={cand} nick={nick} onUpdate={u=>saveCands(candidates.map(c=>c.id===u.id?u:c))}/>
          :<Empty title="후보를 찾을 수 없어요."/>}</div>}
      </div>

      {(showNickModal||editNick)&&<NicknameModal current={nick} isFirst={showNickModal&&!editNick}
        onSave={v=>{setNick(v);setShowNickModal(false);setEditNick(false);}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
