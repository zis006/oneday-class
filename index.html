<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ═══════════════════════════════════════════════════════════════
   🔥 Firebase 설정
═══════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCsU4kItKc3hytFBmyiGUMRqYwf_9isTBs",
  authDomain:        "oneday-class-f1396.firebaseapp.com",
  projectId:         "oneday-class-f1396",
  storageBucket:     "oneday-class-f1396.firebasestorage.app",
  messagingSenderId: "563875409178",
  appId:             "1:563875409178:web:7f9bf95f4adf808d2d50a3",
  measurementId:     "G-V85BRDYE24"
};

let db = null, auth = null;
const CONFIGURED = FIREBASE_CONFIG.apiKey !== "여기에_붙여넣기";
if (CONFIGURED) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();

  } catch(e) { console.warn('Firebase 초기화 실패:', e); }

/* ── 구글 간편로그인 ─────────────────────────────────────────────
   모바일 실패 원인 두 가지를 같이 처리한다.
   1) 카톡·인스타 등 인앱 브라우저: 구글이 OAuth 자체를 차단(disallowed_useragent)
      → SDK로 우회 불가. 외부 브라우저로 열도록 안내해야 한다.
   2) 팝업: 모바일에서 자주 막히거나 즉시 닫힘 → 리다이렉트로 폴백 */
const UA = navigator.userAgent || '';
const IS_MOBILE  = /Android|iPhone|iPad|iPod/i.test(UA);
const IS_ANDROID = /Android/i.test(UA);
const IS_IOS     = /iPhone|iPad|iPod/i.test(UA);

// 이름을 아는 인앱 브라우저들 (네이버웍스·카톡·인스타 등)
const KNOWN_IN_APP = /KAKAOTALK|KAKAOSTORY|NAVER\(inapp|WorksMobile|NaverWorks|GSaaSMobileApp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|everytimeApp|Snapchat|TikTok|musical_ly|Twitter|; ?wv\)/i.test(UA);
// 목록에 없는 인앱도 잡는다: iOS 정식 브라우저는 UA 에 Version/ 이 있는데 웹뷰는 없다
const IOS_WEBVIEW = IS_IOS && !/Version\/\d/.test(UA) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA);
const IN_APP_BROWSER = KNOWN_IN_APP || IOS_WEBVIEW;
const IN_APP_NAME =
  /KAKAOTALK/i.test(UA) ? '카카오톡' :
  /WorksMobile|NaverWorks|GSaaSMobileApp/i.test(UA) ? '네이버웍스' :
  /NAVER\(inapp/i.test(UA) ? '네이버' :
  /Instagram/i.test(UA) ? '인스타그램' :
  /FBAN|FBAV|FB_IAB/i.test(UA) ? '페이스북' :
  /Line\//i.test(UA) ? '라인' : '';

function externalBrowserUrl(){
  const bare = location.href.replace(/^https?:\/\//,'');
  if(IS_ANDROID) return `intent://${bare}#Intent;scheme=https;package=com.android.chrome;end`;
  if(IS_IOS)     return `x-safari-https://${bare}`;   // 일부 iOS 웹뷰에서 사파리로 전환됨
  return null;
}

// authDomain(firebaseapp.com)이 배포 도메인과 달라서 리다이렉트 방식은
// 브라우저 저장소 분리 정책에 막혀 조용히 실패한다. 그래서 팝업을 기본으로 쓰고
// 실패하면 자동으로 넘기지 말고 원인을 그대로 보여준다.
async function signIn(){
  if(!auth) return {err:'Firebase 설정이 필요해요'};
  if(IN_APP_BROWSER) return {inApp:true};
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  try {
    await auth.signInWithPopup(provider);
    return {};
  } catch(e) {
    if(e.code==='auth/popup-closed-by-user' || e.code==='auth/cancelled-popup-request') return {};
    return {err:`${e.code||''} ${e.message||e}`.trim(), canRetry:true};
  }
}
// 팝업이 아예 안 열리는 환경을 위한 수동 폴백
async function signInRedirect(){
  if(!auth) return {err:'Firebase 설정이 필요해요'};
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  try { await auth.signInWithRedirect(provider); return {}; }
  catch(e){ return {err:`${e.code||''} ${e.message||e}`.trim()}; }
}
// 화면에서 바로 캡처해 보낼 수 있는 진단 정보
function authDiagnostics(){
  return [
    `origin: ${location.origin}`,
    `authDomain: ${FIREBASE_CONFIG.authDomain}`,
    `inApp: ${IN_APP_BROWSER} / mobile: ${IS_MOBILE}`,
    `cookies: ${navigator.cookieEnabled}`,
    `storage: ${(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return 'ok';}catch(e){return 'blocked';}})()}`,
    `UA: ${UA}`,
  ].join('\n');
}
// 리다이렉트로 돌아왔을 때의 실패는 여기서만 잡힌다
function consumeRedirectError(){
  if(!auth) return Promise.resolve('');
  return auth.getRedirectResult().then(()=>'').catch(e=>`${e.code||''} ${e.message||e}`.trim());
}
function signOut(){ if(auth) auth.signOut(); }

// AbortSignal.timeout 은 iOS 16 미만에 없어서 구형 기기에서 터진다
function timeoutSignal(ms){
  if(typeof AbortSignal!=='undefined'&&typeof AbortSignal.timeout==='function') return AbortSignal.timeout(ms);
  if(typeof AbortController==='undefined') return undefined;
  const c=new AbortController(); setTimeout(()=>c.abort(),ms); return c.signal;
}

/* ── 카카오 로컬 검색 (주소 채우기용) ────────────────────────────
   네이버는 자동 조회를 막고 있어서 링크만으로 주소를 못 가져온다.
   카카오 REST 키를 넣으면 "장소명 → 주소" 검색으로 대신 채울 수 있다.
   키 발급: developers.kakao.com > 내 애플리케이션 > REST API 키
   (플랫폼 > Web 에 배포 도메인 등록 필요, 무료·카드 불필요) */
const KAKAO_REST_KEY = 'f89d3cb33646b4ff8cae87322dfff492';

async function searchPlaces(q){
  if(!KAKAO_REST_KEY) return {ok:false,reason:'no-key'};
  if(!q.trim()) return {ok:true,items:[]};
  try{
    const r=await fetch('https://dapi.kakao.com/v2/local/search/keyword.json?size=10&query='+encodeURIComponent(q.trim()),
      {headers:{Authorization:'KakaoAK '+KAKAO_REST_KEY},signal:timeoutSignal(8000)});
    if(r.status===401||r.status===403) return {ok:false,reason:'bad-key'};
    if(!r.ok) return {ok:false,reason:'http-'+r.status};
    const d=await r.json();
    return {ok:true,items:(d.documents||[]).map(x=>({
      name:x.place_name||'',
      address:x.road_address_name||x.address_name||'',
      kakaoUrl:x.place_url||'',
    }))};
  }catch(e){ return {ok:false,reason:'network'}; }
}

/* ── Cloudinary ──────────────────────────────────────────────── */
const CLOUDINARY_CLOUD = 'r9jlchwx';
const CLOUDINARY_PRESET = 'oneday-class';
const DOC = () => db && db.collection('od_club').doc('shared');

// 권한 오류는 삼키지 않고 던진다 (멤버가 아닌 계정을 구분하기 위해)
async function fbGet(){
  if(!db){try{return JSON.parse(localStorage.getItem('od_shared')||'{}');}catch{return {};}}
  const s=await DOC().get();
  return s.exists?s.data():{};
}
async function fbSet(key,val){
  if(!db){const cur=JSON.parse(localStorage.getItem('od_shared')||'{}');localStorage.setItem('od_shared',JSON.stringify({...cur,[key]:val}));return;}
  try{await DOC().set({[key]:val},{merge:true});}catch(e){console.error(e);}
}
function fbListen(cb){
  if(!db)return()=>{};
  return DOC().onSnapshot(s=>{if(s.exists)cb(s.data());});
}

/* ── 사진 업로드 ─────────────────────────────────────────────── */
async function uploadPhoto(file) {
  if(file.size > 10*1024*1024){alert('10MB 이하 사진만 올릴 수 있어요');return null;}
  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {method:'POST', body: form});
    const data = await res.json();
    if(data.secure_url) return data.secure_url;
    throw new Error(data.error?.message || '업로드 실패');
  } catch(e) {
    console.error(e);
    alert('사진 업로드 실패: ' + e.message);
    return null;
  }
}

/* ── 지도 링크 (네이버 / 카카오) ─────────────────────────────── */
const isKakaoUrl = u => /kakao\.com|kko\.kr/i.test(u||'');
const isNaverUrl = u => /naver\.me|naver\.com/i.test(u||'');
const isMapUrl   = u => isKakaoUrl(u) || isNaverUrl(u);

// https:// 가 없으면 <a href> 가 사이트 내부 상대경로로 해석돼 404 가 난다
function normUrl(u){
  const s=String(u||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  return 'https://'+s.replace(/^\/+/,'').replace(/^(https?:)?\/*/i,'');
}
// 구버전(naverUrl 한 칸에 카카오 링크가 들어간 경우)까지 흡수 + 스킴 보정
function getLinks(o){
  const urls=[o.naverUrl,o.kakaoUrl,o.url].filter(Boolean).map(normUrl);
  return {naverUrl:urls.find(isNaverUrl)||'', kakaoUrl:urls.find(isKakaoUrl)||''};
}

const SIDO='서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충청|충북|충남|전라|전북|전남|경상|경북|경남|제주';
// 실패 응답에서 가게명처럼 딸려오는 값들
const BAD_NAMES=/^(URL Source|Published Time|네이버 지도|네이버 플레이스|카카오맵|Kakao ?Map|다음지도|)$/i;
// 도로명/지번이 실제로 들어있는 후보만 주소로 인정 (홍보문구 오탐 방지)
function pickAddress(text){
  if(!text) return '';
  const t=text.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();
  const hits=t.match(new RegExp(`(${SIDO})[^|·\\n\\]\\)]{4,70}`,'g'))||[];
  const hasRoad=/(로|길|동|가|읍|면|리)\s?\d/;
  for(const h of hits){
    if(!hasRoad.test(h)) continue;
    // 우편번호·전화·영업시간·이모지 등 뒤따르는 안내문구는 잘라낸다
    const s=h.split(/\s*\(우|📌|⏰|☎|전화번호|영업시간|매일|\d{2,4}-\d{3,4}-\d{4}/)[0]
             .trim().replace(/[,.]+$/,'');
    if(s.length>=8) return s;
  }
  return '';
}

/* 링크 → 가게명·주소 자동 추출.
   ※ 브라우저에서 외부 사이트를 직접 못 읽어서 공개 프록시를 거친다.
     - 카카오(place.map.kakao.com): 정상 동작
     - 네이버: 봇 차단(CAPTCHA)이 걸려 대부분 실패 → 주소는 직접 입력해야 함
   실패 사유를 호출부에 알려주기 위해 {ok,name,address,reason} 형태로 반환한다. */
async function fetchPlaceInfo(url){
  if(!isMapUrl(url)) return {ok:false,reason:'bad-url'};

  const readers=[
    // 1) 렌더링된 텍스트를 주는 리더 (SPA에도 강함)
    async()=>{
      const r=await fetch('https://r.jina.ai/'+url,{signal:timeoutSignal(8000)});
      if(!r.ok) throw new Error('reader '+r.status);
      const t=await r.text();
      if(/requiring CAPTCHA/i.test(t)) throw new Error('blocked');
      // \s 는 줄바꿈까지 먹어서 다음 줄(URL Source:)을 잡아버리므로 가로 공백만 허용
      const name=((t.match(/^Title:[ \t]*(.+)$/m)||[])[1]||'').split(/\s*[|:]\s*/)[0].trim();
      return {name:BAD_NAMES.test(name)?'':name,address:pickAddress(t)};
    },
    // 2) 원문 HTML의 og 태그
    async()=>{
      const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url),{signal:timeoutSignal(8000)});
      if(!r.ok) throw new Error('proxy '+r.status);
      const html=await r.text();
      const og=p=>{
        const m=html.match(new RegExp(`<meta[^>]*property="${p}"[^>]*content="([^"]+)"`,'i'))||
                html.match(new RegExp(`<meta[^>]*content="([^"]+)"[^>]*property="${p}"`,'i'));
        return m?m[1].replace(/&amp;/g,'&').replace(/&#39;/g,"'"):'';
      };
      return {name:(og('og:title')||'').split(/\s*[|:]\s*/)[0].trim(),address:pickAddress(og('og:description'))};
    },
  ];

  // 순차로 돌리면 실패 시 대기가 길어져서, 병렬로 던지고 먼저 성공한 것을 쓴다
  const hit=await new Promise(resolve=>{
    let pending=readers.length, settled=false;
    const finish=r=>{ if(!settled){settled=true;resolve(r);} };
    const miss=()=>{ if(--pending===0) finish(null); };
    readers.forEach(read=>read()
      .then(r=>{ if(r&&(r.name||r.address)) finish(r); else miss(); })
      .catch(e=>{ console.warn('장소 정보 조회 실패:',e.message); miss(); }));
  });
  if(hit) return {ok:true,name:hit.name||'',address:hit.address||''};
  return {ok:false,reason:isNaverUrl(url)?'naver-blocked':'unavailable'};
}

/* ── Utilities ───────────────────────────────────────────────── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const WD=['일','월','화','수','목','금','토'];
const NICK_MAX=10;   // 닉네임 길이 제한 (공백 포함)

/* ── 회원 등급 ────────────────────────────────────────────────
   정회원 : 모든 기능
   객원멤버: 조회 + 활동 소감 좋아요만. 단, 초대받은 달에는 그 달 소감 작성 가능
   등급 도입 시점에 이미 가입해 있던 사람은 전부 정회원으로 승계된다. */
const ROLE_MEMBER='member', ROLE_GUEST='guest';
const ADMIN_EMAILS=['yjs951008@gmail.com'];   // 등급을 바꿀 수 있는 운영자

const isAdmin   = me => !!me && ADMIN_EMAILS.includes(String(me.email||'').toLowerCase());
const isMember  = me => !!me && me.role===ROLE_MEMBER;
const invitesOf = me => (me&&me.invites)||[];
// 객원멤버는 초대받은 달의 기록에만 소감을 쓸 수 있다
const canWriteImp = (me,rec) => isMember(me) || (!!rec && invitesOf(me).includes(rec.month));
const roleLabel = me => isMember(me)?'정회원':'객원멤버';
const CATS=['도예','요리','베이킹','공예','그림','플라워','캘리','가죽','기타'];
const CE={도예:'🏺',요리:'🍳',베이킹:'🥐',공예:'✂️',그림:'🎨',플라워:'💐',캘리:'✒️',가죽:'👜',기타:'✨'};

/* 투표는 uid 기준으로 저장: {uid:{k:'당장',name:'지수'}}
   구버전은 {닉네임:'당장'} 형태라 읽을 때 정규화한다 */
function getVotes(c){
  const out={};
  Object.entries(c.votes||{}).forEach(([key,v])=>{
    if(typeof v==='string') out[key]={k:v,name:key};
    else if(v&&v.k)         out[key]={k:v.k,name:v.name||'멤버'};
  });
  return out;
}
const calcScore=c=>Object.values(getVotes(c)).reduce((s,v)=>s+(VMAP[v.k]?VMAP[v.k].score:0),0);
const voterCount=c=>Object.keys(getVotes(c)).length;

function nthWkday(year,month,wday,n){
  const base=new Date(year,month,1);const[y,m]=[base.getFullYear(),base.getMonth()];let c=0;
  for(let d=1;d<=31;d++){const dt=new Date(y,m,d);if(dt.getMonth()!==m)break;if(dt.getDay()===wday&&++c===n)return dt;}
  return null;
}
/* 활동 당일 19시를 기준으로 '다가오는 → 다녀온' 이 한 번에 넘어간다.
   두 화면이 같은 경계를 쓰므로 겹치는 구간도, 비는 구간도 없다. */
const RECORD_OPEN_HOUR=19;
const handoffAt=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),RECORD_OPEN_HOUR,0,0);
// 다녀온 기록 생성 시점이 지났는지
function recordOpened(classDate){ return new Date()>=handoffAt(classDate); }
// 다가오는 클래스는 인계 시점(19시) 전까지만 이번 달을 가리킨다
function getNextClassDate(){
  const now=new Date();
  const [y,m]=[now.getFullYear(),now.getMonth()];
  const cur=nthWkday(y,m,3,2);
  if(cur&&handoffAt(cur)>now) return cur;
  return nthWkday(y,m+1,3,2);
}
const toISO=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const toYM=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:'';
const ymLabel=ym=>{if(!ym)return'';const[y,m]=ym.split('-');return`${y}년 ${String(+m).padStart(2,'0')}월`;};
const fmtDot=d=>d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${WD[d.getDay()]})`:'';
// 구버전은 date가 "2026년 5월 28일 (목)" 문자열로 저장돼 있어 ISO로 정규화
const toISODate=d=>{
  if(!d)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  const m=String(d).match(/(\d{4})[년.\-\/]\s*(\d{1,2})[월.\-\/]\s*(\d{1,2})/);
  return m?`${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`:'';
};
const displayDate=d=>{
  const iso=toISODate(d);
  return iso?fmtDot(new Date(iso+'T00:00:00')):(d||'');
};
const daysUntil=d=>{const a=new Date();a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/86400000);};
const won=n=>`${Number(n||0).toLocaleString()}원`;

// 한줄평은 멤버별로 쌓인다. 구버전의 단일 문자열(review)도 목록으로 흡수
function getPartyReviews(p){
  const list=(p.reviews||[]).map(r=>({id:r.id,uid:r.uid||'',author:r.author||'',text:r.text||'',createdAt:r.createdAt||0}));
  if(p.review&&String(p.review).trim()) list.unshift({id:'legacy-'+(p.id||''),uid:'',author:'',text:String(p.review).trim(),createdAt:0});
  return list;
}
function getAfterParties(rec){
  const raw=(rec.afterParties&&rec.afterParties.length>0)
    ? rec.afterParties
    : (rec.afterPartyName||rec.afterPartyAddress)
      ? [{id:'legacy',name:rec.afterPartyName||'',address:rec.afterPartyAddress||'',url:rec.afterPartyUrl||''}]
      : [];
  return raw.map(p=>({...PARTY_DEFAULTS,...p,...getLinks(p),photos:p.photos||[],reviews:p.reviews||[]}));
}

/* ── 활동 소감 정규화 (구버전 리뷰 흡수) ─────────────────────── */
function getImpressions(rec){
  const norm=i=>({id:i.id,uid:i.uid||'',author:i.author,text:i.text||'',rating:i.rating||0,photo:i.photo||null,
    likes:i.likes||[],replies:i.replies||[],editedAt:i.editedAt||0,createdAt:i.createdAt||0});
  return [...(rec.impressions||[]).map(norm),...(rec.reviews||[]).map(norm)].sort((a,b)=>b.createdAt-a.createdAt);
}
// 로그인 이전에 쌓인 소감은 uid가 없어 표시이름으로 대조

function impAvg(list){
  const rated=list.filter(i=>i.rating>0);

/* ── 장소 입력 (지도 링크 한 칸 + 주소) ──────────────────────
   주소를 채우는 경로를 3단으로 둔다.
   1) 붙여넣은 텍스트 안에 주소가 같이 있으면 그대로 사용 (앱 공유 텍스트)
   2) 링크에서 자동 추출 (카카오는 됨 / 네이버는 차단)
   3) 장소명으로 카카오 검색해서 고르기 (네이버 링크의 대안) */
const RE_MAP_URL=/(?:https?:\/\/)?[\w.-]*(?:naver\.me|map\.naver\.com|place\.map\.kakao\.com|map\.kakao\.com|kko\.kr)\/?[^\s,;)\]]*/gi;
function extractMapUrls(text){
  return (String(text||'').match(RE_MAP_URL)||[]).map(normUrl).filter(isMapUrl);
}
// 주소를 찾을 때 URL 조각이 섞이지 않도록 제거
const stripUrls=t=>String(t||'').replace(RE_MAP_URL,' ').replace(/https?:\/\/\S+/gi,' ');

function PlaceFields({v,onChange,onName,nameHint}){
  const [raw,setRaw]=useState('');
  const [fetching,setFetching]=useState(false);
  const [err,setErr]=useState('');
  const [note,setNote]=useState('');
  const [q,setQ]=useState('');
  const [searching,setSearching]=useState(false);
  const [results,setResults]=useState(null);
  const vRef=useRef(v);
  useEffect(()=>{vRef.current=v;},[v]);
  const addrRef=useRef(null);

  async function commit(text){
    const urls=extractMapUrls(text);
    if(!urls.length){setErr('네이버 지도 또는 카카오맵 링크를 넣어주세요');return;}
    setErr('');setNote('');setRaw('');

    // 1) 링크를 종류별로 담고, 같이 붙여넣은 텍스트에서 주소를 먼저 찾아본다
    const patch={...vRef.current};
    urls.forEach(u=>{patch[isKakaoUrl(u)?'kakaoUrl':'naverUrl']=u;});
    const fromText=pickAddress(stripUrls(text));
    let filled=false;
    if(fromText&&!patch.address){patch.address=fromText;filled=true;}
    onChange(patch);
    if(filled){setNote('붙여넣은 내용에서 주소를 찾았어요. 틀리면 고쳐주세요.');return;}
    if(patch.address) return;   // 이미 주소가 있으면 조회할 필요 없음

    // 2) 링크에서 추출 (성공률 높은 카카오 우선)
    setFetching(true);
    const target=urls.find(isKakaoUrl)||urls[0];
    const info=await fetchPlaceInfo(target);
    setFetching(false);
    const cur=vRef.current;
    if(info.ok&&info.address&&!cur.address){
      onChange({...cur,address:info.address});
      setNote('주소를 자동으로 넣었어요. 틀리면 고쳐주세요.');
    }else{
      // 3) 네이버는 조회가 막혀 있으니, 이미 입력한 이름으로 곧바로 검색해준다
      const hint=String(nameHint||'').trim();
      if(KAKAO_REST_KEY&&hint){
        setQ(hint);
        await doSearch(hint,`'${hint}'로 찾은 결과예요. 맞는 곳을 골라주세요.`);
      }else if(KAKAO_REST_KEY){
        setNote('장소명을 입력하면 주소를 찾아드릴게요.');
        if(addrRef.current) addrRef.current.focus();
      }else{
        setNote('주소는 직접 입력해주세요.');
        if(addrRef.current) addrRef.current.focus();
      }
    }
    if(info.ok&&info.name&&onName) onName(info.name);
  }

  async function doSearch(query,okNote){
    const term=String(query!==undefined?query:q).trim();
    if(!term)return;
    setSearching(true);setResults(null);setNote('');
    const r=await searchPlaces(term);
    setSearching(false);
    if(!r.ok){
      setResults([]);
      setNote(r.reason==='bad-key'?'카카오 REST 키가 올바르지 않아요.'
        :r.reason==='no-key'?'카카오 REST 키가 설정되지 않았어요.'
        :'검색에 실패했어요. 잠시 후 다시 시도해주세요.');
      return;
    }
    setResults(r.items);
    setNote(r.items.length
      ? (okNote||'')
      : `'${term}' 검색 결과가 없어요. 이름을 바꿔서 찾아보세요.`);
  }
  function pick(item){
    const cur=vRef.current;
    onChange({...cur,address:item.address,kakaoUrl:cur.kakaoUrl||normUrl(item.kakaoUrl)});
    if(onName&&item.name) onName(item.name);
    setResults(null);setQ('');
    setNote('주소를 넣었어요. 틀리면 고쳐주세요.');
  }

  function onType(e){
    const val=e.target.value;
    setRaw(val);
    if(err)setErr('');
    if(extractMapUrls(val).length) commit(val);   // 붙여넣는 즉시 인식
  }
  function remove(key){ onChange({...vRef.current,[key]:''}); }

  const chip=(key,badge,label,bg,color)=>(
    <span key={key} style={{display:'inline-flex',alignItems:'center',gap:6,background:'#fff',border:'1.5px solid #E4E4EC',borderRadius:20,padding:'4px 6px 4px 10px',fontSize:12,fontWeight:700,color:'#3A3A44'}}>
      <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:18,height:18,borderRadius:5,background:bg,color,fontSize:10,fontWeight:900}}>{badge}</span>
      {label}
      <button onClick={()=>remove(key)} style={{background:'none',border:'none',cursor:'pointer',color:'#BFBFC8',fontSize:15,lineHeight:1,padding:'0 3px'}}>×</button>
    </span>
  );

  return(
    <div style={{border:'1.5px solid #E9E9F0',borderRadius:12,padding:14,background:'#FAFAFC',display:'flex',flexDirection:'column',gap:10}}>
      <div style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>📍 장소 <span style={{fontWeight:400,color:'#9A9AA6'}}>링크를 넣으면 주소가 자동 입력돼요</span></div>

/* ── 사진 뷰어 (좌우로 넘겨보기) ─────────────────────────────── */
function Lightbox({photos,index,onIndex,onClose}){
  const n=photos.length;
  const i=Math.min(Math.max(index,0),n-1);
  const touchX=useRef(null);
  const go=d=>onIndex((i+d+n)%n);

  useEffect(()=>{
    const onKey=e=>{
      if(e.key==='Escape')onClose();
      else if(e.key==='ArrowRight'&&n>1)go(1);
      else if(e.key==='ArrowLeft'&&n>1)go(-1);
    };
    window.addEventListener('keydown',onKey);
    const prev=document.body.style.overflow;
    document.body.style.overflow='hidden';           // 뒤 배경 스크롤 잠금
    return()=>{window.removeEventListener('keydown',onKey);document.body.style.overflow=prev;};
  },[i,n]);

  const arrow={position:'absolute',top:'50%',transform:'translateY(-50%)',width:44,height:44,borderRadius:'50%',
    background:'rgba(0,0,0,.45)',color:'#fff',border:'none',cursor:'pointer',fontSize:22,lineHeight:1,
    display:'flex',alignItems:'center',justifyContent:'center',zIndex:2};

  return(
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
      style={{position:'fixed',inset:0,zIndex:400,background:'rgba(0,0,0,.92)',display:'flex',alignItems:'center',justifyContent:'center'}}>

      <div style={{position:'absolute',top:0,left:0,right:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',zIndex:2}}>
        <span style={{color:'#fff',fontSize:13,fontWeight:700,opacity:.85}}>{n>1?`${i+1} / ${n}`:''}</span>
        <button onClick={onClose} style={{background:'rgba(0,0,0,.4)',border:'none',color:'#fff',fontSize:24,lineHeight:1,width:36,height:36,borderRadius:'50%',cursor:'pointer'}}>×</button>
      </div>

      {n>1&&<button onClick={()=>go(-1)} style={{...arrow,left:10}}>‹</button>}
      {n>1&&<button onClick={()=>go(1)}  style={{...arrow,right:10}}>›</button>}

      <img src={photos[i]} alt=""
        onTouchStart={e=>{touchX.current=e.touches[0].clientX;}}
        onTouchEnd={e=>{
          if(touchX.current==null||n<2)return;
          const dx=e.changedTouches[0].clientX-touchX.current;
          if(Math.abs(dx)>50) go(dx<0?1:-1);      // 스와이프로 넘기기
          touchX.current=null;
        }}
        style={{maxWidth:'92vw',maxHeight:'82vh',objectFit:'contain',borderRadius:6,userSelect:'none'}}/>

      {n>1&&<div style={{position:'absolute',bottom:14,left:0,right:0,display:'flex',gap:6,justifyContent:'center',padding:'0 16px',overflowX:'auto'}}>
        {photos.map((p,k)=>(
          <img key={k} src={p} alt="" onClick={()=>onIndex(k)}
            style={{width:44,height:44,objectFit:'cover',borderRadius:6,cursor:'pointer',flexShrink:0,
              opacity:k===i?1:.45,border:k===i?'2px solid #fff':'2px solid transparent'}}/>
        ))}
      </div>}
    </div>
  );
}

        ?<div style={{background:'#F7F7FA',borderRadius:12,padding:12,display:'flex',flexDirection:'column',gap:10,marginBottom:list.length?14:0}}>
          <FT rows={3} value={text} onChange={e=>setText(e.target.value)} placeholder="자유롭게 한마디 남겨주세요 ✏️"/>
          <div style={{display:'flex',gap:8}}>
            <Btn sx={{flex:1}} onClick={submit}>남기기</Btn>
            <Btn v="gray" onClick={()=>{setOpen(false);setText('');}}>취소</Btn>
          </div>
        </div>
        :<Btn v="out" sx={{width:'100%',marginBottom:list.length?14:0}} onClick={()=>setOpen(true)}>✏️ 방명록 남기기</Btn>}

      {list.length===0&&!open&&<div style={{fontSize:13,color:'#A6A6B2',textAlign:'center',padding:'16px 0 4px'}}>첫 방명록을 남겨주세요!</div>}
      {list.map((g,i)=>(
        <div key={g.id}>
          {i>0&&<div className="divider"/>}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:6}}>
            <UserLine uid={g.uid} fallbackName={g.author} profiles={profiles} size={20}/>
            <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
              <span style={{fontSize:11,color:'#A6A6B2'}}>{g.createdAt?fmtDot(new Date(g.createdAt)).slice(0,10):''}</span>
              {me&&g.uid===me.uid&&<button onClick={()=>onDelete(g.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#D6D6DE',fontSize:17,lineHeight:1,padding:0}}>×</button>}
            </div>
          </div>
          <div style={{fontSize:14,color:'#3A3A44',lineHeight:1.65,whiteSpace:'pre-line'}}>{g.text}</div>
        </div>
      ))}
    </div>
  );
}

/* ═══════════════════ 홈 ═══════════════════════════════════════ */
function HomeTab({candidates,records,confirmed,me,profiles,go,onConfirm,guestbook,onAddGuest,onDelGuest}){
  const [picking,setPicking]=useState(false);
  const nextDate=getNextClassDate();
  const nextYM=toYM(nextDate);
  const days=daysUntil(nextDate);
  const confirmedCand=confirmed[nextYM]?candidates.find(c=>c.id===confirmed[nextYM]):null;
  // 이미 활동으로 선정된 후보는 투표 현황·선택 목록에서 제외 (이번 달 확정분은 남겨 해제 가능)
  const chosen=new Set(Object.values(confirmed||{}).filter(id=>id!==confirmed[nextYM]));
  const pool=candidates.filter(c=>!chosen.has(c.id));
  const top3=pool.filter(c=>c.id!==confirmed[nextYM]).sort((a,b)=>calcScore(b)-calcScore(a)).slice(0,3);

  // 지난 원데이 클래스: 오늘 이전의 가장 최근 기록
  const past=[...records].filter(r=>!r.isStub||getImpressions(r).length>0).sort((a,b)=>recDateKey(b).localeCompare(recDateKey(a)))[0]
    ||[...records].sort((a,b)=>recDateKey(b).localeCompare(recDateKey(a)))[0];
  // 홈에는 "내가" 남긴 소감만 노출
  const myImps=past?getImpressions(past).filter(i=>isMine(i,me)):[];
  const latestImp=myImps[0];

  return(
    <div className="home-grid">
      {/* 다가오는 원데이 클래스 */}
      <div className="sec">
        <div className="sec-h"><span className="sec-t">다가오는 원데이 클래스</span></div>
        <div style={CS}>
          {confirmedCand?<React.Fragment>
            <div onClick={()=>go({t:'cand',id:confirmedCand.id})} style={{cursor:'pointer'}}>
              <Chip cat={confirmedCand.cat}/>
              <div style={{fontSize:17,fontWeight:800,color:'#1B1B22',margin:'8px 0 10px'}}>{confirmedCand.name}</div>
              <div style={{fontSize:14,color:'#5A5A66'}}>{fmtDot(nextDate)}</div>
              <div style={{fontSize:14,color:'#5A5A66',marginTop:2}}>{days}일 후</div>
            </div>
            {isMember(me)&&<Btn v="out" sx={{width:'100%',marginTop:14}} onClick={()=>setPicking(true)}>클래스 변경하기</Btn>}
          </React.Fragment>:<React.Fragment>
            <span style={{fontSize:12,color:'#8A8A96',fontWeight:600}}>⏳ 미확정</span>
            <div style={{fontSize:17,fontWeight:800,color:'#1B1B22',margin:'8px 0 10px'}}>아직 클래스가 결정되지 않았어요</div>
            <div style={{fontSize:14,color:'#5A5A66'}}>{fmtDot(nextDate)}</div>
            <div style={{fontSize:14,color:'#5A5A66',marginTop:2}}>{days}일 후</div>
            {isMember(me)&&<Btn sx={{width:'100%',marginTop:14}} onClick={()=>setPicking(true)}>후보 목록에서 선택하기</Btn>}
          </React.Fragment>}
        </div>
      </div>

      {/* 상세로 안 들어가고 목록에서 바로 확정 */}
      {picking&&<Modal title={`${ymLabel(nextYM)} 클래스 선택`} onClose={()=>setPicking(false)}>
        {pool.length===0
          ?<Empty title="후보가 없어요." sub="먼저 클래스 후보를 등록해주세요."
             action={<Btn sx={{width:'100%'}} onClick={()=>{setPicking(false);go({t:'candidates',add:true});}}>클래스 추가하기</Btn>}/>
          :<React.Fragment>
            <div style={{fontSize:12,color:'#A6A6B2',marginBottom:12}}>득표수 높은 순이에요. 누르면 바로 확정됩니다.</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {[...pool].sort((a,b)=>calcScore(b)-calcScore(a)).map(c=>{
                const on=confirmed[nextYM]===c.id;
                return(
                  <button key={c.id} onClick={()=>{onConfirm(nextYM,c.id);setPicking(false);}}
                    style={{width:'100%',textAlign:'left',fontFamily:'inherit',cursor:'pointer',borderRadius:12,padding:'12px 14px',background:on?'#F1EFFE':'#FAFAFC',border:on?'1.5px solid #6C5CE7':'1.5px solid #EFEFF3'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                      <div style={{minWidth:0}}>
                        <Chip cat={c.cat}/>
                        <div style={{fontSize:15,fontWeight:800,color:'#1B1B22',margin:'3px 0'}}>{c.name}</div>
                        <div style={{fontSize:12,color:'#8A8A96'}}>{won(c.price)}{c.address?` · ${c.address}`:''}</div>
                      </div>
                      <div style={{flexShrink:0,textAlign:'right'}}>
                        <div style={{fontSize:12,fontWeight:800,color:'#5A5A66'}}>{calcScore(c)}점</div>
                        {on&&<div style={{fontSize:12,color:'#6C5CE7',fontWeight:800,marginTop:2}}>✓ 확정</div>}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
            {confirmed[nextYM]&&<Btn v="gray" sx={{width:'100%',marginTop:12}}
              onClick={()=>{onConfirm(nextYM,confirmed[nextYM]);setPicking(false);}}>확정 취소하기</Btn>}
          </React.Fragment>}
      </Modal>}

      {/* 투표 현황 */}
      <div className="sec sec-vote">
        <div className="sec-h"><span className="sec-t">다음달 원데이 클래스 투표 현황</span></div>
        {top3.length===0
          ?<div style={CS}><Empty title="활동 후보가 없어요." sub={isMember(me)?'체험하고 싶은 클래스 후보를 등록해주세요.':''}
              action={isMember(me)?<Btn sx={{width:'100%'}} onClick={()=>go({t:'candidates',add:true})}>클래스 추가하기</Btn>:null}/></div>
          :<div style={{display:'flex',flexDirection:'column',gap:10}}>
            {top3.map((c,i)=>(
              <div key={c.id} onClick={()=>go({t:'cand',id:c.id})} style={{...CS,cursor:'pointer',display:'flex',alignItems:'center',gap:14}}>
                <span style={{fontSize:26,fontWeight:900,fontStyle:'italic',color:'#1B1B22',flexShrink:0,minWidth:22,textAlign:'center'}}>{i+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <Chip cat={c.cat}/>
                  <div style={{fontSize:15,fontWeight:800,color:'#1B1B22',margin:'4px 0 3px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}</div>
                  <div style={{fontSize:13,color:'#8A8A96',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.address||'장소 미정'}</div>
                </div>
                <span style={{fontSize:12,color:'#5A5A66',fontWeight:700,flexShrink:0,alignSelf:'flex-end'}}>득표수 : {calcScore(c)}</span>
              </div>
            ))}
          </div>}
      </div>

      {/* 지난 활동 소감 — 객원멤버에게는 노출하지 않는다 */}
      {isMember(me)&&<div className="sec">
        <div className="sec-h"><span className="sec-t">지난 원데이 클래스 활동 소감</span></div>
        {!past
          ?<div style={CS}><Empty title="아직 다녀온 클래스가 없어요." sub="첫 활동을 기록해보세요!"
              action={<Btn sx={{width:'100%'}} onClick={()=>go({t:'records'})}>기록하러 가기</Btn>}/></div>
          :<div style={CS}>
            <Chip cat={past.cat}/>
            <div style={{fontSize:15,fontWeight:700,color:'#1B1B22',marginTop:6}}>{past.name}</div>
            <div className="divider"/>
            {latestImp
              ?<ImpressionItem imp={latestImp} me={me} profiles={profiles} compact/>
              :<Empty title="아직 소감을 남기지 않으셨네요!" sub="소감을 공유해 주세요"
                 action={<Btn sx={{width:'100%'}} onClick={()=>go({t:'record',id:past.id,imp:true})}>소감 남기러 가기</Btn>}/>}
          </div>}
      </div>}

      {/* 방명록 — 등급 관계없이 누구나 */}
      <div className="sec">
        <div className="sec-h"><span className="sec-t">방명록</span></div>
        <Guestbook entries={guestbook} me={me} profiles={profiles} onAdd={onAddGuest} onDelete={onDelGuest}/>
      </div>
    </div>
  );
}

/* ═══════════════════ 다녀온 ═══════════════════════════════════ */
function RecordsTab({records,candidates,onSave,go,me,openAdd,onAddClosed}){
  const [desc,setDesc]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  useEffect(()=>{if(openAdd){setShowAdd(true);onAddClosed&&onAddClosed();}},[openAdd]);
  const sorted=[...records].sort((a,b)=>desc?recDateKey(b).localeCompare(recDateKey(a)):recDateKey(a).localeCompare(recDateKey(b)));
  const canAdd=isMember(me);
  return(
    <div style={{minHeight:'calc(100vh - 200px)',display:'flex',flexDirection:'column'}}>
      <div className="sec-h" style={{marginBottom:12}}>
        <span className="sec-t">총 {records.length}회</span>
        <SortToggle desc={desc} onToggle={()=>setDesc(d=>!d)}/>
      </div>
      <div style={{flex:1}}>
      {sorted.length===0
        ?<div style={CS}><Empty title="아직 기록이 없어요." sub="다녀온 클래스를 기록해보세요!"/></div>
        :<div className="card-grid">
          {sorted.map(r=>{
            const imps=getImpressions(r);
            const avg=impAvg(imps);
            const cover=r.thumb||(r.photos||[])[0];
            return(
              <div key={r.id} style={CS}>
                <div onClick={()=>go({t:'record',id:r.id})} style={{cursor:'pointer'}}>
                  {cover&&<div style={{width:'100%',aspectRatio:'16/9',borderRadius:10,overflow:'hidden',background:'#EDEDF0',marginBottom:12}}>
                    <img src={cover} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>e.target.style.display='none'}/>
                  </div>}
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7,flexWrap:'wrap'}}>
                    <MonthBadge ym={r.month}/>
                    <Chip cat={r.cat}/>
                    {r.isStub&&!r.activity&&<span style={{fontSize:11,background:'#FFFBEB',color:'#B45309',borderRadius:20,padding:'3px 9px',fontWeight:700}}>✏️ 기록 채우기</span>}
                  </div>
                  <div style={{fontSize:16,fontWeight:800,color:'#1B1B22',marginBottom:5}}>{r.name}</div>
                  <div style={{fontSize:13,color:'#5A5A66',marginBottom:7}}>{displayDate(r.date)}</div>
                  <div style={{display:'flex',alignItems:'center',gap:14,fontSize:13,color:'#5A5A66'}}>
                    <span>💰 {won(r.price)}</span>
                    <span>⭐ 별점 : {avg||'0.0'}</span>
                  </div>
                </div>
                {imps.length===0&&canWriteImp(me,r)&&<Btn sx={{width:'100%',marginTop:14}} onClick={()=>go({t:'record',id:r.id,imp:true})}>소감 남기기</Btn>}
              </div>
            );
          })}
        </div>}
      </div>
      {canAdd&&<div className="sticky-add">
        <Btn sx={{width:'100%'}} onClick={()=>setShowAdd(true)}>+ 기록 추가</Btn>
      </div>}
      {showAdd&&canAdd&&<AddRecordModal candidates={candidates} onAdd={r=>onSave([...records,r])} onClose={()=>setShowAdd(false)}/>}
    </div>
  );
}

/* ── 다녀온 상세 ─────────────────────────────────────────────── */
function RecordDetail({rec,onUpdate,me,profiles,openImp}){
  const [showEdit,setShowEdit]=useState(false);
  const [showImpForm,setShowImpForm]=useState(!!openImp);
  const [partyDraft,setPartyDraft]=useState(null);
  const [uploadingPhoto,setUploadingPhoto]=useState(false);

  const impressions=getImpressions(rec);
  const photos=rec.photos||[];
  const afterParties=getAfterParties(rec);
  const links=getLinks(rec);
  const canEdit=isMember(me);              // 기록·사진·뒷풀이 편집
  const mayWrite=canWriteImp(me,rec);      // 소감 작성 (초대받은 달이면 객원도 가능)
  const [inviteCopied,setInviteCopied]=useState(false);

  function update(changes){onUpdate({...rec,...changes});}
  function copyInvite(){
    const url=inviteUrl(rec.month);
    const done=()=>setInviteCopied(true);
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(()=>{});
    else {const el=document.createElement('textarea');el.value=url;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();done();}
  }

  const photosRef=useRef(photos);
  useEffect(()=>{photosRef.current=rec.photos||[];},[rec.photos]);
  async function handlePhotoUpload(file){
    setUploadingPhoto(true);
    const url=await uploadPhoto(file);
    if(url){
      const next=[...photosRef.current,url];
      photosRef.current=next;
      update({photos:next,thumb:rec.thumb||next[0]});
    }
    setUploadingPhoto(false);
    return url;
  }
  function deletePhoto(i){
    if(!confirm('이 사진을 삭제할까요?'))return;
    const removed=photos[i];
    const next=photos.filter((_,idx)=>idx!==i);
    update({photos:next,thumb:rec.thumb===removed?(next[0]||''):(rec.thumb||'')});
  }

  // 소감: impressions / 구버전 reviews 양쪽 모두 반영
  function patchImp(id,fn){
    update({
      impressions:(rec.impressions||[]).map(i=>i.id===id?fn(i):i),
      reviews:(rec.reviews||[]).map(i=>i.id===id?fn(i):i),
    });
  }
  function addImpression(imp){update({impressions:[...(rec.impressions||[]),imp],isStub:false});setShowImpForm(false);}
  function delImpression(id){
    if(!confirm('삭제할까요?'))return;
    update({impressions:(rec.impressions||[]).filter(x=>x.id!==id),reviews:(rec.reviews||[]).filter(x=>x.id!==id)});
  }
  function likeImp(id){
    patchImp(id,i=>{
      const likes=i.likes||[];
      return {...i,likes:likes.includes(me.uid)?likes.filter(n=>n!==me.uid):[...likes,me.uid]};
    });
  }
  function editImp(updated){ patchImp(updated.id,()=>updated); }
  // 대댓글 — 정회원·객원멤버 모두 가능
  function addReply(impId,reply){ patchImp(impId,i=>({...i,replies:[...(i.replies||[]),reply]})); }
  function delReply(impId,replyId){
    if(!confirm('답글을 삭제할까요?'))return;
    patchImp(impId,i=>({...i,replies:(i.replies||[]).filter(r=>r.id!==replyId)}));
  }
  // 로그인 도입 전 소감(uid 없음)을 내 계정에 연결
  // uid만 붙이면 표시 이름은 계정 프로필에서 자동으로 따라온다
  function claimImp(imp){
    if(!confirm(`"${imp.author}" 이름으로 쓴 이 소감을 내 계정(${me.name})에 연결할까요?\n연결하면 작성자가 "${me.name}"으로 표시됩니다.`))return;
    patchImp(imp.id,i=>({...i,uid:me.uid}));
  }

  // 뒷풀이
  const draftIsNew=partyDraft&&!afterParties.some(x=>x.id===partyDraft.id);
  function saveParty(){
    const p=partyDraft;
    if(!p.name.trim()&&!p.address.trim()){alert('장소명이나 주소를 입력해주세요');return;}
    update({afterParties:draftIsNew?[...afterParties,p]:afterParties.map(x=>x.id===p.id?p:x)});
    setPartyDraft(null);
  }
  function delParty(id){
    if(!confirm('이 뒷풀이 장소를 삭제할까요?'))return;
    update({afterParties:afterParties.filter(x=>x.id!==id)});
  }
  // 뒷풀이 한줄평 (멤버별)
  function addPartyReview(pid,review){
    update({afterParties:afterParties.map(x=>x.id===pid?{...x,reviews:[...(x.reviews||[]),review]}:x)});
  }
  function delPartyReview(pid,rid){
    if(!confirm('한줄평을 삭제할까요?'))return;
    update({afterParties:afterParties.map(x=>x.id===pid?{...x,reviews:(x.reviews||[]).filter(r=>r.id!==rid)}:x)});
  }

  return(
    <React.Fragment>
      {/* 기본 정보 */}
      <div style={{...CS,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}><MonthBadge ym={rec.month}/><Chip cat={rec.cat}/></div>
          {canEdit&&<SmallBtn onClick={()=>setShowEdit(true)}>✏️ 수정</SmallBtn>}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {rec.date&&<div style={{fontSize:14,color:'#3A3A44'}}><b style={{fontWeight:700}}>날짜:</b> {displayDate(rec.date)}</div>}
          <div style={{fontSize:14,color:'#3A3A44'}}><b style={{fontWeight:700}}>금액:</b> {won(rec.price)}</div>
          <AddressRow address={rec.address} naverUrl={links.naverUrl} kakaoUrl={links.kakaoUrl}/>
          {rec.activity&&<div style={{marginTop:3}}>
            <div style={{fontSize:14,fontWeight:700,color:'#1B1B22',marginBottom:5}}>활동 내용</div>
            <div style={{fontSize:13,color:'#5A5A66',lineHeight:1.7,whiteSpace:'pre-line'}}>{rec.activity}</div>
          </div>}
        </div>
      </div>

      {/* 활동 사진 */}
      <div style={{...CS,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <span style={{fontSize:14,fontWeight:800,color:'#1B1B22'}}>활동 사진 ({photos.length}장)</span>
          {canEdit&&<PhotoUploadBtn onUpload={handlePhotoUpload} uploading={uploadingPhoto}/>}
        </div>
        {photos.length===0
          ?<div style={{fontSize:13,color:'#A6A6B2',textAlign:'center',padding:'14px 0'}}>{canEdit?'사진을 올려보세요':'아직 사진이 없어요'}</div>
          :<React.Fragment>
            <PhotoGrid photos={photos} onDelete={canEdit?deletePhoto:null} thumb={rec.thumb} onSetThumb={canEdit?(u=>update({thumb:u})):null}/>
            {canEdit&&<div style={{fontSize:11,color:'#A6A6B2',marginTop:8}}>☐ 대표를 체크하면 목록 썸네일이 돼요</div>}
          </React.Fragment>}
      </div>

      {/* 활동 소감 */}
      <div style={{...CS,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:showImpForm?12:4}}>
          <span style={{fontSize:14,fontWeight:800,color:'#1B1B22'}}>활동 소감 ({impressions.length}개)</span>
          <div style={{display:'flex',gap:6}}>
            {/* 정회원은 이 달 소감을 쓸 수 있는 초대 링크를 만들어 객원멤버에게 줄 수 있다 */}
            {canEdit&&rec.month&&<SmallBtn onClick={copyInvite}>{inviteCopied?'복사됨':'🔗 초대 링크'}</SmallBtn>}
            {!showImpForm&&mayWrite&&<SmallBtn onClick={()=>setShowImpForm(true)}>소감 남기기</SmallBtn>}
          </div>
        </div>
        {!mayWrite&&<div style={{marginBottom:12}}><GuestNote>객원멤버는 참여한 달에 받은 초대 링크로 들어와야 소감을 남길 수 있어요. 좋아요는 언제든 가능해요.</GuestNote></div>}
        {showImpForm&&mayWrite&&<div style={{marginBottom:impressions.length?4:0}}><ImpressionForm me={me} onSubmit={addImpression} onCancel={()=>setShowImpForm(false)}/></div>}
        {impressions.length===0&&!showImpForm
          ?<div style={{fontSize:13,color:'#A6A6B2',textAlign:'center',padding:'14px 0'}}>{mayWrite?'첫 소감을 남겨주세요!':'아직 소감이 없어요'}</div>
          :impressions.map((imp,i)=>(
            <div key={imp.id}>{i>0||showImpForm?<div className="divider"/>:null}
              <ImpressionItem imp={imp} me={me} profiles={profiles} compact
                onLike={likeImp} onDelete={delImpression} onClaim={claimImp}
                onEdit={editImp} onReply={addReply} onDelReply={delReply}/>
            </div>
          ))}
      </div>

      {/* 뒷풀이 */}
      {afterParties.map((p,i)=>(
        partyDraft&&partyDraft.id===p.id
          ?<div key={p.id} style={{marginBottom:10}}>
            <PartyEditor p={partyDraft} index={i+1} onChange={setPartyDraft}/>
            <div style={{display:'flex',gap:8,marginTop:8}}><Btn sx={{flex:1}} onClick={saveParty}>저장</Btn><Btn v="gray" onClick={()=>setPartyDraft(null)}>취소</Btn></div>
          </div>
          :<PartyCard key={p.id||i} p={p} index={i+1} me={me} profiles={profiles}
             onEdit={canEdit?()=>setPartyDraft({...p}):null} onDelete={canEdit?()=>delParty(p.id):null}
             onAddReview={canEdit?addPartyReview:null} onDelReview={canEdit?delPartyReview:null}/>
      ))}
      {draftIsNew&&<div style={{marginBottom:10}}>
        <PartyEditor p={partyDraft} index={afterParties.length+1} onChange={setPartyDraft}/>
        <div style={{display:'flex',gap:8,marginTop:8}}><Btn sx={{flex:1}} onClick={saveParty}>추가</Btn><Btn v="gray" onClick={()=>setPartyDraft(null)}>취소</Btn></div>
      </div>}
      {!partyDraft&&canEdit&&<Btn sx={{width:'100%',marginTop:4}} onClick={()=>setPartyDraft(newParty())}>+ 뒷풀이 장소 추가</Btn>}

      {showEdit&&<EditRecordModal rec={rec} onSave={u=>{onUpdate(u);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </React.Fragment>
  );
}

/* ═══════════════════ 다음 활동 후보 ═══════════════════════════ */
function CandidatesTab({candidates,confirmed,onSave,go,me,profiles,openAdd,onAddClosed}){
  const [desc,setDesc]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  useEffect(()=>{if(openAdd){setShowAdd(true);onAddClosed&&onAddClosed();}},[openAdd]);
  // 활동으로 선정된 후보는 목록에서 빠진다 (확정 취소하면 다시 나타남)
  const chosen=new Set(Object.values(confirmed||{}));
  const pool=candidates.filter(c=>!chosen.has(c.id));
  const sorted=[...pool].sort((a,b)=>desc?(b.addedAt||0)-(a.addedAt||0):(a.addedAt||0)-(b.addedAt||0));
  return(
    <div style={{minHeight:'calc(100vh - 200px)',display:'flex',flexDirection:'column'}}>
      <div className="sec-h" style={{marginBottom:12}}>
        <span className="sec-t">총 {pool.length}개</span>
        <SortToggle desc={desc} onToggle={()=>setDesc(d=>!d)}/>
      </div>
      <div style={{flex:1}}>
        {sorted.length===0
          ?<div style={CS}><Empty title="아직 후보가 없어요." sub="체험하고 싶은 클래스를 추가해보세요!"/></div>
          :<div className="card-grid">
            {sorted.map(c=>(
              <div key={c.id} onClick={()=>go({t:'cand',id:c.id})} style={{...CS,cursor:'pointer'}}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
                  <Chip cat={c.cat}/>
                  {}
                </div>
                <div style={{fontSize:16,fontWeight:800,color:'#1B1B22',margin:'6px 0 8px'}}>{c.name}</div>
                <div style={{fontSize:13,color:'#5A5A66',marginBottom:4}}>💰 {won(c.price)}</div>
                <div style={{fontSize:13,color:'#5A5A66'}}>👍 추천수 {calcScore(c)}개 <span style={{color:'#A6A6B2'}}>· {voterCount(c)}명 참여</span></div>
                {(c.addedByUid||c.addedBy)&&<div style={{fontSize:12,color:'#A6A6B2',marginTop:4}}>등록 · {nameOf(profiles,c.addedByUid,c.addedBy)}</div>}
              </div>
            ))}
          </div>}
      </div>
      {isMember(me)
        ?<div className="sticky-add"><Btn sx={{width:'100%'}} onClick={()=>setShowAdd(true)}>+ 추가</Btn></div>
        :<div style={{paddingTop:14}}><GuestNote>객원멤버는 후보 등록과 투표에 참여할 수 없어요. 구경하고 소감에 좋아요를 남길 수 있어요.</GuestNote></div>}
      {showAdd&&isMember(me)&&<AddCandidateModal me={me} onAdd={c=>onSave([...candidates,c])} onClose={()=>setShowAdd(false)}/>}
    </div>
  );
}

/* ── 후보 상세 ───────────────────────────────────────────────── */
function CandidateDetail({cand,onUpdate,onDelete,onConfirm,confirmed,me,profiles}){
  const [showEdit,setShowEdit]=useState(false);
  const nextYM=toYM(getNextClassDate());
  const isConfirmed=(confirmed||{})[nextYM]===cand.id;
  const isChosen=Object.values(confirmed||{}).includes(cand.id);   // 어느 달이든 확정된 적 있으면 삭제 불가
  const votes=getVotes(cand);
  const myVote=votes[me.uid]?votes[me.uid].k:null;
  const links=getLinks(cand);
  const mine=cand.addedByUid?cand.addedByUid===me.uid:false;
  // 익명 투표: 이름은 저장하지 않고 uid만 키로 쓴다 (본인 수정·취소용)
  function castVote(key){
    onUpdate({...cand,votes:{...(cand.votes||{}),[me.uid]:{k:key}}});
  }
  function cancelVote(){
    const next={...(cand.votes||{})};delete next[me.uid];
    onUpdate({...cand,votes:next});
  }
  return(
    <React.Fragment>
      <div style={{...CS,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:12}}>
          <Chip cat={cand.cat}/>
          {isMember(me)&&<div style={{display:'flex',gap:6}}>
            <SmallBtn onClick={()=>setShowEdit(true)}>✏️ 수정</SmallBtn>
            {/* 후보는 등록한 본인만 삭제 가능. 활동으로 확정된 후보는 삭제 불가 */}
            {mine&&!isChosen&&<SmallBtn sx={{background:'#FEF2F2',color:'#E5484D'}}
              onClick={()=>{if(confirm(`"${cand.name}" 후보를 삭제할까요?\n투표 내용도 함께 사라집니다.`))onDelete(cand);}}>🗑 삭제</SmallBtn>}
          </div>}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          <div style={{fontSize:14,color:'#3A3A44'}}><b style={{fontWeight:700}}>금액:</b> {won(cand.price)}</div>
          <AddressRow address={cand.address} naverUrl={links.naverUrl} kakaoUrl={links.kakaoUrl}/>
          {cand.activity&&<div style={{marginTop:3}}>
            <div style={{fontSize:14,fontWeight:700,color:'#1B1B22',marginBottom:5}}>활동 내용</div>
            <div style={{fontSize:13,color:'#5A5A66',lineHeight:1.7,whiteSpace:'pre-line'}}>{cand.activity}</div>
          </div>}
          {(cand.addedByUid||cand.addedBy)&&<div style={{fontSize:12,color:'#A6A6B2'}}>등록 · {nameOf(profiles,cand.addedByUid,cand.addedBy)}</div>}
        </div>
        {isMember(me)&&<Btn v={isConfirmed?'out':'pri'} sx={{width:'100%',marginTop:14}} onClick={()=>onConfirm(nextYM,cand.id)}>
          {isConfirmed?`✓ ${ymLabel(nextYM)} 클래스로 확정됨 (누르면 해제)`:`${ymLabel(nextYM)} 클래스로 확정하기`}
        </Btn>}
      </div>

      {/* 투표: 익명 · 언제든 변경 가능 · 투표 전에도 결과 공개 */}
      <div style={CS}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:4}}>
          <span style={{fontSize:14,fontWeight:800,color:'#1B1B22'}}>투표</span>
          <span style={{fontSize:12,color:'#8A8A96',fontWeight:700}}>득표수 {calcScore(cand)} · {voterCount(cand)}명 참여</span>
        </div>
        <div style={{fontSize:12,color:'#A6A6B2',marginBottom:14}}>
          {isMember(me)?'익명 투표예요. 누른 뒤에도 언제든 바꿀 수 있어요.':'객원멤버는 결과만 볼 수 있어요.'}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {VOPTS.map(o=>{
            const isMe=myVote===o.k;
            const canVote=isMember(me);
            const cnt=Object.values(votes).filter(v=>v.k===o.k).length;
            const total=voterCount(cand);
            const pct=total?Math.round(cnt/total*100):0;
            return(
              <button key={o.k} onClick={()=>canVote&&castVote(o.k)} disabled={!canVote} style={{position:'relative',overflow:'hidden',width:'100%',display:'flex',alignItems:'center',gap:10,padding:'12px 14px',borderRadius:10,cursor:canVote?'pointer':'default',fontFamily:'inherit',textAlign:'left',border:isMe?`1.5px solid ${o.color}`:'1.5px solid #EFEFF3',background:'#fff'}}>
                {/* 결과 미리보기: 투표 여부와 상관없이 항상 보여준다 */}
                <span style={{position:'absolute',left:0,top:0,bottom:0,width:`${pct}%`,background:isMe?'#F1EFFE':'#F5F5F8',transition:'width .25s'}}/>
                <span style={{position:'relative',fontSize:17,flexShrink:0}}>{o.e}</span>
                <span style={{position:'relative',flex:1,fontSize:14,fontWeight:isMe?800:600,color:isMe?o.color:'#3A3A44'}}>{o.label}</span>
                <span style={{position:'relative',fontSize:12,color:cnt?'#5A5A66':'#C4C4CC',fontWeight:700,flexShrink:0}}>{cnt}명</span>
              </button>
            );
          })}
        </div>
        {myVote&&isMember(me)&&<button onClick={cancelVote} style={{marginTop:12,background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:700,color:'#8A8A96',padding:0}}>내 투표 취소하기</button>}
      </div>

      {showEdit&&<EditCandidateModal cand={cand} onSave={u=>{onUpdate(u);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </React.Fragment>
  );
}

/* ═══════════════════ 입력 모달 ════════════════════════════════ */
function CatPicker({value,onChange}){

    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{CATS.map(c=>
      <button key={c} onClick={()=>onChange(value===c?'':c)} style={{border:'none',borderRadius:20,padding:'6px 13px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',background:value===c?'#6C5CE7':'#F1F1F5',color:value===c?'#fff':'#5A5A66'}}>{CE[c]} {c}</button>
    )}</div></div>;
}

function AddCandidateModal({me,onAdd,onClose}){
  const [f,setF]=useState({name:'',cat:'',activity:'',price:'',address:'',naverUrl:'',kakaoUrl:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  function submit(){
    if(!f.name.trim()){alert('클래스 이름을 입력해주세요');return;}
    // 작성자는 입력받지 않고 로그인 계정으로 기록 (표시 이름은 프로필에서 끌어옴)
    onAdd({id:uid(),...f,name:f.name.trim(),price:f.price?Number(String(f.price).replace(/,/g,'')):0,
      votes:{},addedByUid:me.uid,addedBy:me.name,addedAt:Date.now()});
    onClose();
  }
  return(
    <Modal title="클래스 후보 추가" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <FI label="클래스 이름 *" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="예: 홍대 도자기 공방"/>
        <CatPicker value={f.cat} onChange={v=>set('cat',v)}/>
        <PlaceFields nameHint={f.name} v={f} onChange={nv=>setF(p=>({...p,...nv}))} onName={n=>setF(p=>p.name?p:{...p,name:n})}/>
        <FI label="금액 (1인, 원)" value={f.price} onChange={e=>set('price',e.target.value)} placeholder="45000" type="number"/>
        <FT label="활동 내용" value={f.activity} onChange={e=>set('activity',e.target.value)} placeholder="어떤 활동을 하는지 적어주세요"/>
        <div style={{fontSize:12,color:'#A6A6B2'}}>등록자는 <b style={{color:'#5A5A66'}}>{me.name}</b> 으로 기록돼요</div>
        <div style={{display:'flex',gap:10,marginTop:4}}><Btn sx={{flex:1}} onClick={submit}>추가하기</Btn><Btn v="gray" onClick={onClose}>취소</Btn></div>
      </div>
    </Modal>
  );
}

function EditCandidateModal({cand,onSave,onClose}){
  const [f,setF]=useState({name:cand.name||'',cat:cand.cat||'',activity:cand.activity||'',price:cand.price||'',address:cand.address||'',...getLinks(cand)});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  function submit(){
    if(!f.name.trim()){alert('클래스 이름을 입력해주세요');return;}
    onSave({...cand,...f,name:f.name.trim(),price:f.price?Number(String(f.price).replace(/,/g,'')):0});
    onClose();
  }
  return(
    <Modal title="클래스 후보 수정" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <FI label="클래스 이름 *" value={f.name} onChange={e=>set('name',e.target.value)}/>
        <CatPicker value={f.cat} onChange={v=>set('cat',v)}/>
        <PlaceFields nameHint={f.name} v={f} onChange={nv=>setF(p=>({...p,...nv}))}/>
        <FI label="금액 (1인, 원)" value={f.price} onChange={e=>set('price',e.target.value)} type="number"/>
        <FT label="활동 내용" value={f.activity} onChange={e=>set('activity',e.target.value)}/>
        <div style={{display:'flex',gap:10,marginTop:4}}><Btn sx={{flex:1}} onClick={submit}>저장하기</Btn><Btn v="gray" onClick={onClose}>취소</Btn></div>
      </div>
    </Modal>
  );
}

function RecordFormBody({f,setF,photos,setPhotos,thumb,setThumb,afterParties,setAfterParties}){
  const [uploading,setUploading]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const photosRef=useRef(photos);
  useEffect(()=>{photosRef.current=photos;},[photos]);
  async function handlePhoto(file){
    setUploading(true);
    const url=await uploadPhoto(file);
    if(url){const next=[...photosRef.current,url];photosRef.current=next;setPhotos(next);setThumb(t=>t||url);}
    setUploading(false);
    return url;
  }
  function delPhoto(i){
    const removed=photos[i];const next=photos.filter((_,x)=>x!==i);
    setPhotos(next);if(thumb===removed)setThumb(next[0]||'');
  }
  return(
    <React.Fragment>
      <FI label="클래스 이름 *" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="예: 홍대 도자기 공방"/>
      <CatPicker value={f.cat} onChange={v=>set('cat',v)}/>
      <PlaceFields nameHint={f.name} v={f} onChange={nv=>setF(p=>({...p,...nv}))} onName={n=>setF(p=>p.name?p:{...p,name:n})}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div><label style={{fontSize:12,fontWeight:700,color:'#6B7280',display:'block',marginBottom:5}}>날짜</label>
          <input type="date" value={f.date} onChange={e=>{const d=e.target.value;set('date',d);set('month',d.slice(0,7));}} style={IS}/></div>
        <FI label="금액 (1인, 원)" value={f.price} onChange={e=>set('price',e.target.value)} placeholder="45000" type="number"/>
      </div>
      <FT label="활동 내용" value={f.activity} onChange={e=>set('activity',e.target.value)} placeholder="어떤 활동을 했는지 적어주세요" rows={3}/>
      <div style={{border:'1.5px solid #E9E9F0',borderRadius:12,padding:14,background:'#FAFAFC'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <span style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>활동 사진</span>
          <PhotoUploadBtn onUpload={handlePhoto} uploading={uploading}/>
        </div>
        {photos.length>0
          ?<React.Fragment><PhotoGrid photos={photos} onDelete={delPhoto} thumb={thumb} onSetThumb={setThumb}/>
            <div style={{fontSize:11,color:'#A6A6B2',marginTop:8}}>☐ 대표를 체크하면 목록 썸네일이 돼요</div></React.Fragment>
          :<div style={{fontSize:12,color:'#A6A6B2'}}>여러 장 올릴 수 있어요</div>}
      </div>
      <div style={{border:'1.5px solid #E9E9F0',borderRadius:12,padding:14,background:'#FAFAFC'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <span style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>🍻 뒷풀이 장소</span>
          <SmallBtn onClick={()=>setAfterParties(p=>[...p,newParty()])}>+ 추가</SmallBtn>
        </div>
        {afterParties.length===0&&<div style={{fontSize:12,color:'#A6A6B2'}}>1차, 2차 장소를 추가하세요</div>}
        {afterParties.map((p,i)=>(
          <div key={p.id} style={{marginBottom:8}}>
            <PartyEditor p={p} index={i+1} onChange={np=>setAfterParties(a=>a.map(x=>x.id===np.id?np:x))} onRemove={()=>setAfterParties(a=>a.filter(x=>x.id!==p.id))}/>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function AddRecordModal({candidates,onAdd,onClose}){
  const now=new Date();
  const initDate=()=>{const d=nthWkday(now.getFullYear(),now.getMonth(),3,2);return d?toISO(d):'';};
  const [f,setF]=useState({candId:'',name:'',cat:'',month:toYM(now),date:initDate(),activity:'',price:'',address:'',naverUrl:'',kakaoUrl:''});
  const [photos,setPhotos]=useState([]);
  const [thumb,setThumb]=useState('');
  const [afterParties,setAfterParties]=useState([]);
  function selectCand(cid){
    const c=candidates.find(x=>x.id===cid);
    if(c) setF(p=>({...p,candId:cid,name:c.name,cat:c.cat||'',activity:c.activity||'',price:c.price?String(c.price):'',address:c.address||'',...getLinks(c)}));
    else setF(p=>({...p,candId:cid}));
  }
  function submit(){
    if(!f.name.trim()){alert('클래스 이름을 입력해주세요');return;}
    onAdd({id:uid(),...f,name:f.name.trim(),price:f.price?Number(String(f.price).replace(/,/g,'')):0,
      photos,thumb:thumb||photos[0]||'',afterParties,impressions:[],reviews:[],createdAt:Date.now()});
    onClose();
  }
  return(
    <Modal title="다녀온 클래스 기록" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div><label style={{fontSize:12,fontWeight:700,color:'#6B7280',display:'block',marginBottom:5}}>후보에서 불러오기 (선택)</label>
          <select value={f.candId} onChange={e=>selectCand(e.target.value)} style={{...IS,color:f.candId?'#1B1B22':'#9CA3AF'}}>
            <option value="">직접 입력</option>{candidates.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select></div>
        <RecordFormBody f={f} setF={setF} photos={photos} setPhotos={setPhotos} thumb={thumb} setThumb={setThumb} afterParties={afterParties} setAfterParties={setAfterParties}/>
        <div style={{display:'flex',gap:10,marginTop:4}}><Btn sx={{flex:1}} onClick={submit}>저장하기</Btn><Btn v="gray" onClick={onClose}>취소</Btn></div>
      </div>
    </Modal>
  );
}

function EditRecordModal({rec,onSave,onClose}){
  const [f,setF]=useState({name:rec.name||'',cat:rec.cat||'',month:rec.month||'',date:toISODate(rec.date),activity:rec.activity||'',price:rec.price||'',address:rec.address||'',...getLinks(rec)});
  const [photos,setPhotos]=useState(rec.photos||[]);
  const [thumb,setThumb]=useState(rec.thumb||'');
  const [afterParties,setAfterParties]=useState(getAfterParties(rec).map(p=>({...p,id:p.id||uid()})));
  function submit(){
    if(!f.name.trim()){alert('클래스 이름을 입력해주세요');return;}
    onSave({...rec,...f,name:f.name.trim(),price:f.price?Number(String(f.price).replace(/,/g,'')):0,
      photos,thumb:thumb||photos[0]||'',afterParties,isStub:false});
    onClose();
  }
  return(
    <Modal title="기록 수정" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <RecordFormBody f={f} setF={setF} photos={photos} setPhotos={setPhotos} thumb={thumb} setThumb={setThumb} afterParties={afterParties} setAfterParties={setAfterParties}/>
        <div style={{display:'flex',gap:10,marginTop:4}}><Btn sx={{flex:1}} onClick={submit}>저장하기</Btn><Btn v="gray" onClick={onClose}>취소</Btn></div>
      </div>
    </Modal>
  );
}

/* ── 로그인 화면 ─────────────────────────────────────────────── */
function LoginScreen({initialError}){
  const [busy,setBusy]=useState(false);
  const [inApp,setInApp]=useState(IN_APP_BROWSER);
  const [err,setErr]=useState(initialError||'');
  const [copied,setCopied]=useState(false);

  const [canRetry,setCanRetry]=useState(false);
  const [showDiag,setShowDiag]=useState(false);
  const [diagCopied,setDiagCopied]=useState(false);

  async function go(){
    setBusy(true);setErr('');setCanRetry(false);
    const r=await signIn();
    setBusy(false);
    if(r.inApp) setInApp(true);
    else if(r.err){setErr(r.err);setCanRetry(!!r.canRetry);}
  }
  async function goRedirect(){
    setBusy(true);setErr('');
    const r=await signInRedirect();
    setBusy(false);
    if(r.err) setErr(r.err);
  }
  function copyText(t,cb){
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(cb).catch(()=>{});
    else { const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();cb(); }
  }
  const copyLink=()=>copyText(location.href,()=>setCopied(true));
  const intentUrl=externalBrowserUrl();

    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>

        <div style={{fontSize:40,marginBottom:14}}>🎨</div>
        <div style={{fontSize:20,fontWeight:800,color:'#1B1B22',marginBottom:8}}>원데이 클래스 동아리</div>

            <div style={{fontSize:12,color:'#92400E',lineHeight:1.7}}>
              구글 정책상 앱에 내장된 브라우저에서는 로그인이 되지 않아요.
              <b> {IS_ANDROID?'크롬':'사파리'}로 열어주세요.</b>
              {IS_ANDROID

                : <><br/>아래 버튼이 안 되면 우측 하단 <b>⤴︎</b> 또는 <b>⋯</b> → "Safari로 열기"</>}

          </a>}
          <Btn v="gray" sx={{width:'100%'}} onClick={copyLink}>{copied?'주소를 복사했어요':'주소 복사하기'}</Btn>
          <button onClick={go} style={{marginTop:12,background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:12,color:'#A6A6B2',textDecoration:'underline'}}>그래도 로그인 시도해보기</button>
        </React.Fragment>:<React.Fragment>
          <p style={{fontSize:13,color:'#8A8A96',lineHeight:1.7,marginBottom:24}}>
            동아리 기록과 투표를 보려면<br/>구글 계정으로 로그인해주세요.

          <button onClick={go} disabled={busy}
            style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:9,padding:'13px 18px',borderRadius:10,border:'1.5px solid #E4E4EC',background:'#fff',cursor:busy?'default':'pointer',fontFamily:'inherit',fontSize:14,fontWeight:700,color:'#3A3A44'}}>

        <div style={{marginTop:16,textAlign:'left'}}>
          <button onClick={()=>setShowDiag(s=>!s)} style={{background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:11,color:'#A6A6B2',textDecoration:'underline',padding:0}}>
            {showDiag?'진단 정보 접기':'로그인이 안 되나요? 진단 정보 보기'}
          </button>
          {showDiag&&<React.Fragment>
            <pre style={{marginTop:8,background:'#F7F7FA',borderRadius:8,padding:'10px 12px',fontSize:10,color:'#5A5A66',lineHeight:1.6,whiteSpace:'pre-wrap',wordBreak:'break-all',fontFamily:'ui-monospace,Menlo,monospace'}}>{authDiagnostics()}{err?`\nerror: ${err}`:''}</pre>
            <Btn v="gray" sx={{width:'100%',marginTop:8,fontSize:12,padding:'9px 14px'}}
              onClick={()=>copyText(authDiagnostics()+(err?`\nerror: ${err}`:''),()=>setDiagCopied(true))}>
              {diagCopied?'복사했어요':'진단 정보 복사하기'}
            </Btn>
          </React.Fragment>}
        </div>
      </div>
    </div>
  );
}

          <div style={{fontSize:12,fontWeight:700,color:'#6B7280',marginBottom:10}}>👑 멤버 등급 관리</div>

                </div>

/* ═══════════════════ App ══════════════════════════════════════ */
const TABS=[{id:'home',l:'홈'},{id:'records',l:'다녀온'},{id:'candidates',l:'다음 활동 후보'}];
const isDetail=v=>v.t==='record'||v.t==='cand';

/* 화면 상태를 주소(#)에 담아둔다 → 새로고침해도 보던 페이지가 그대로 유지됨 */
const VIEW_TABS=['home','records','candidates'];
function parseHash(){
  const h=String(location.hash||'').replace(/^#\/?/,'');
  const [t,id]=h.split('/');
  if((t==='record'||t==='cand')&&id) return {t,id:decodeURIComponent(id)};
  if(t==='invite'&&id) return {t:'invite',ym:decodeURIComponent(id)};   // 객원멤버 초대
  if(VIEW_TABS.includes(t)) return {t};
  return {t:'home'};
}
const inviteUrl=ym=>`${location.origin}${location.pathname}#/invite/${encodeURIComponent(ym)}`;
const viewToHash=v=>isDetail(v)?`#/${v.t}/${encodeURIComponent(v.id)}`:`#/${v.t}`;

function App(){
  const [view,setView]=useState(parseHash);
  const [candidates,setCandidates]=useState([]);
  const [records,setRecords]=useState([]);
  const [confirmed,setConfirmed]=useState({});
  const [profiles,setProfiles]=useState({});
  const [guestbook,setGuestbook]=useState([]);
  const [tick,setTick]=useState(0);   // 19시 경계를 넘길 때 재평가용
  const [user,setUser]=useState(undefined);   // undefined=확인중, null=비로그인
  const [loading,setLoading]=useState(true);
  const [showProfile,setShowProfile]=useState(false);
  const [denied,setDenied]=useState(false);
  const [authError,setAuthError]=useState('');
  const [pendingAdd,setPendingAdd]=useState(null);

  // 로그인 상태 감시 (브라우저에 영구 저장되어 재방문해도 유지됨)
  useEffect(()=>{
    if(!auth){setUser(null);return;}
    // 리다이렉트 방식으로 돌아온 경우의 실패는 여기서만 확인 가능
    consumeRedirectError().then(e=>{if(e)setAuthError(e);});
    return auth.onAuthStateChanged(u=>setUser(u||null));
  },[]);

  // 로그인한 뒤에만 데이터를 읽는다 (보안 규칙이 비로그인 접근을 막음)
  useEffect(()=>{
    if(!user){setLoading(false);return;}
    let alive=true;
    setDenied(false);
    (async()=>{
      let data;
      try{ data=await fbGet(); }
      catch(e){ if(alive){setDenied(true);setLoading(false);} return; }
      if(!alive)return;
      setCandidates(data.candidates||[]);setRecords(data.records||[]);
      setConfirmed(data.confirmed||{});setProfiles(data.profiles||{});setGuestbook(data.guestbook||[]);
      // 첫 로그인이면 프로필 생성. 빠진 항목(가입일·등급)은 채워 넣는다.
      // 등급 도입 전부터 프로필이 있던 사람 = 기존 가입자 → 정회원으로 승계.
      // 프로필이 아예 없는 신규 가입자 → 객원멤버.
      const ps=data.profiles||{}, mine=ps[user.uid];
      if(!mine||!mine.joinedAt||!mine.role){
        const next={...ps,[user.uid]:{
          name:(mine&&mine.name)||user.displayName||'멤버',
          photo:(mine&&mine.photo)||user.photoURL||'',
          joinedAt:(mine&&mine.joinedAt)||Date.now(),
          role:(mine&&mine.role)||(mine?ROLE_MEMBER:ROLE_GUEST),
          invites:(mine&&mine.invites)||[],
        }};
        setProfiles(next);await fbSet('profiles',next);
      }
      setLoading(false);
    })();
    const unsub=fbListen(data=>{
      if(data.candidates)setCandidates(data.candidates);
      if(data.records)setRecords(data.records);
      if(data.confirmed)setConfirmed(data.confirmed);
      if(data.profiles)setProfiles(data.profiles);
      if(data.guestbook)setGuestbook(data.guestbook);
    });
    return()=>{alive=false;unsub&&unsub();};
  },[user]);

  // 뒤로/앞으로 가기와 주소 직접 변경을 화면에 반영
  useEffect(()=>{
    const sync=()=>setView(v=>{
      const n=parseHash();
      // 같은 화면이면 imp 같은 일시 플래그를 유지한다
      return (n.t===v.t&&n.id===v.id)?v:n;
    });
    window.addEventListener('hashchange',sync);
    window.addEventListener('popstate',sync);
    return()=>{window.removeEventListener('hashchange',sync);window.removeEventListener('popstate',sync);};
  },[]);

  // 초대 링크(#/invite/2026-07)로 들어오면 그 달 소감 작성 권한을 부여하고 기록으로 보낸다
  useEffect(()=>{
    if(!user||loading||view.t!=='invite')return;
    const ym=view.ym;
    const mine=profiles[user.uid]||{};
    const has=(mine.invites||[]).includes(ym);
    (async()=>{
      if(!has){
        const next={...profiles,[user.uid]:{...mine,invites:[...(mine.invites||[]),ym]}};
        setProfiles(next);await fbSet('profiles',next);
      }
      const rec=records.find(r=>r.month===ym);
      go(rec?{t:'record',id:rec.id,imp:true}:{t:'records'});
      if(!has) setTimeout(()=>alert(`${ymLabel(ym)} 활동 소감을 남길 수 있어요!`),300);
    })();
  },[user,loading,view.t,view.ym,records]);

  // 확정한 클래스는 활동 당일 19시가 지나면 '다녀온'에 기록을 자동 생성한다
  useEffect(()=>{
    if(!user||loading)return;
    const add=[];
    Object.entries(confirmed||{}).forEach(([ym,cid])=>{
      const c=candidates.find(x=>x.id===cid);
      if(!c)return;
      const [y,m]=ym.split('-').map(Number);
      const d=nthWkday(y,m-1,3,2);
      if(!d)return;
      const iso=toISO(d);
      if(!recordOpened(d))return;                                 // 아직 활동 종료 전
      if(records.some(r=>r.month===ym&&r.candId===cid))return;     // 이미 생성됨
      add.push({
        id:uid(),month:ym,candId:cid,name:c.name,cat:c.cat||'',date:iso,
        activity:c.activity||'',price:c.price||0,address:c.address||'',...getLinks(c),
        photos:[],thumb:'',afterParties:[],impressions:[],reviews:[],
        isStub:true,autoCreated:true,createdAt:Date.now(),
      });
    });
    if(add.length) saveRecs([...records,...add]);
  },[user,loading,confirmed,candidates,records,tick]);

  // 앱을 켜둔 채로 19시를 넘겨도 생성되도록 주기적으로 다시 확인
  useEffect(()=>{
    const t=setInterval(()=>setTick(n=>n+1),5*60*1000);
    return()=>clearInterval(t);
  },[]);

  async function saveCands(data){setCandidates(data);await fbSet('candidates',data);}
  async function saveRecs(data){setRecords(data);await fbSet('records',data);}
  async function saveGuestbook(data){setGuestbook(data);await fbSet('guestbook',data);}
  const addGuestEntry=g=>saveGuestbook([...guestbook,g]);
  const delGuestEntry=id=>{ if(confirm('삭제할까요?')) saveGuestbook(guestbook.filter(g=>g.id!==id)); };
  // 이번(다가오는) 달 클래스 확정 · 같은 후보를 다시 고르면 해제
  async function confirmClass(ym,candId){
    const next={...confirmed};
    if(next[ym]===candId) delete next[ym]; else next[ym]=candId;
    setConfirmed(next);await fbSet('confirmed',next);
  }

  function go(next){
    if(next.add) setPendingAdd(next.t);
    setView(next);
    const h=viewToHash(next);
    if(location.hash!==h) location.hash=h;   // 히스토리에 쌓여 뒤로가기도 동작
  }
  function back(){window.history.back();}

  async function saveProfile(patch){
    const next={...profiles,[user.uid]:{...(profiles[user.uid]||{}),...patch}};
    setProfiles(next);setShowProfile(false);
    await fbSet('profiles',next);
  }
  // 운영자 전용: 다른 멤버 등급 변경
  async function setMemberRole(uid,role){
    if(uid===user.uid)return;
    const next={...profiles,[uid]:{...(profiles[uid]||{}),role}};
    setProfiles(next);await fbSet('profiles',next);
  }

  const spinner=<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#A6A6B2',fontSize:14}}>불러오는 중...</div>;
  if(user===undefined) return spinner;
  if(user===null) return <LoginScreen initialError={authError}/>;
  if(denied) return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{...CS,width:'100%',maxWidth:360,textAlign:'center',padding:'34px 24px'}}>
        <div style={{fontSize:36,marginBottom:14}}>🔒</div>
        <div style={{fontSize:17,fontWeight:800,color:'#1B1B22',marginBottom:8}}>접근 권한이 없어요</div>
        <p style={{fontSize:13,color:'#8A8A96',lineHeight:1.7,marginBottom:20}}>
          {user.email}<br/>이 계정은 동아리 멤버로 등록되어 있지 않아요.<br/>운영자에게 문의해주세요.
        </p>
        <Btn v="gray" sx={{width:'100%'}} onClick={signOut}>다른 계정으로 로그인</Btn>
      </div>
    </div>
  );
  if(loading) return spinner;

  const myProfile=profiles[user.uid]||{};
  const me={
    uid:user.uid,
    name:myProfile.name||user.displayName||'멤버',
    photo:myProfile.photo||'',
    joinedAt:myProfile.joinedAt||0,
    role:myProfile.role||ROLE_GUEST,
    invites:myProfile.invites||[],
    email:user.email||'',
  };

  const rec=view.t==='record'?records.find(r=>r.id===view.id):null;
  const cand=view.t==='cand'?candidates.find(c=>c.id===view.id):null;
  const detailTitle=rec?rec.name:cand?cand.name:'';

  return(
    <div className="shell">
      <div className="nav">
        <div className="nav-in">
          {isDetail(view)
            ?<React.Fragment>
              <button onClick={back} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,color:'#1B1B22',padding:'0 8px 0 0',lineHeight:1}}>‹</button>
              <span style={{flex:1,fontSize:17,fontWeight:800,color:'#1B1B22',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{detailTitle}</span>
            </React.Fragment>
            :<span style={{flex:1,fontSize:20,fontWeight:800,color:'#1B1B22'}}>원데이 클래스 동아리</span>}
          <button onClick={()=>setShowProfile(true)} title={me.name}
            style={{background:'none',border:'none',cursor:'pointer',padding:0,flexShrink:0,display:'flex',alignItems:'center',gap:7,maxWidth:'46%'}}>
            <Avatar src={me.photo} size={30}/>
            <span style={{fontSize:13,fontWeight:700,color:'#3A3A44',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{me.name}</span>
          </button>
        </div>
        {!isDetail(view)&&<div className="nav-tabs">
          {TABS.map(t=><button key={t.id} className={`nav-tab${view.t===t.id?' on':''}`} onClick={()=>go({t:t.id})}>{t.l}</button>)}
        </div>}
      </div>

      <div className="main">
        {view.t==='home'&&<HomeTab candidates={candidates} records={records} confirmed={confirmed} me={me} profiles={profiles} go={go} onConfirm={confirmClass}
          guestbook={guestbook} onAddGuest={addGuestEntry} onDelGuest={delGuestEntry}/>}
        {view.t==='invite'&&<Empty title="초대 링크를 확인하고 있어요..."/>}
        {view.t==='records'&&<RecordsTab records={records} candidates={candidates} onSave={saveRecs} go={go} me={me}
          openAdd={pendingAdd==='records'} onAddClosed={()=>setPendingAdd(null)}/>}
        {view.t==='candidates'&&<CandidatesTab candidates={candidates} confirmed={confirmed} onSave={saveCands} go={go} me={me} profiles={profiles}
          openAdd={pendingAdd==='candidates'} onAddClosed={()=>setPendingAdd(null)}/>}
        {view.t==='record'&&<div className="detail-wrap">{rec
          ?<RecordDetail rec={rec} me={me} profiles={profiles} openImp={view.imp} onUpdate={u=>saveRecs(records.map(r=>r.id===u.id?u:r))}/>
          :<Empty title="기록을 찾을 수 없어요."/>}</div>}
        {view.t==='cand'&&<div className="detail-wrap">{cand
          ?<CandidateDetail cand={cand} me={me} profiles={profiles} confirmed={confirmed} onConfirm={confirmClass}
             onUpdate={u=>saveCands(candidates.map(c=>c.id===u.id?u:c))}
             onDelete={c=>{saveCands(candidates.filter(x=>x.id!==c.id));back();}}/>
          :<Empty title="후보를 찾을 수 없어요."/>}</div>}
      </div>

      {showProfile&&<ProfileModal me={me} profiles={profiles} onSave={saveProfile} onSetRole={setMemberRole} onClose={()=>setShowProfile(false)}/>}
    </div>
  );
}

/* ── 오류 표시 ────────────────────────────────────────────────
   렌더링 중 예외가 나면 React 가 화면을 통째로 비워버려서(빈 화면)
   원인을 알 수 없다. 에러 경계로 잡아서 내용을 그대로 보여준다. */
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null,info:null,copied:false};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err,info){console.error('render error:',err,info);this.setState({info});}
  render(){
    if(!this.state.err) return this.props.children;
    const msg=String((this.state.err&&this.state.err.message)||this.state.err);
    const where=((this.state.info&&this.state.info.componentStack)||'').trim().split('\n').slice(0,5).join('\n');
    const dump=`${msg}\n${where}\n${authDiagnostics()}`;
    return(
      <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
        <div style={{...CS,width:'100%',maxWidth:380,padding:'28px 22px'}}>
          <div style={{fontSize:32,textAlign:'center',marginBottom:12}}>😵</div>
          <div style={{fontSize:16,fontWeight:800,color:'#1B1B22',textAlign:'center',marginBottom:8}}>화면을 그리다가 오류가 났어요</div>
          <p style={{fontSize:12,color:'#8A8A96',lineHeight:1.7,textAlign:'center',marginBottom:16}}>
            아래 내용을 복사해서 알려주시면 바로 고칠 수 있어요.
          </p>
          <pre style={{background:'#FEF2F2',borderRadius:8,padding:'10px 12px',fontSize:10,color:'#B42318',lineHeight:1.6,whiteSpace:'pre-wrap',wordBreak:'break-all',fontFamily:'ui-monospace,Menlo,monospace',maxHeight:220,overflowY:'auto'}}>{dump}</pre>
          <Btn sx={{width:'100%',marginTop:12}} onClick={()=>{
            const done=()=>this.setState({copied:true});
            if(navigator.clipboard) navigator.clipboard.writeText(dump).then(done).catch(()=>{});
            else {const el=document.createElement('textarea');el.value=dump;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();done();}
          }}>{this.state.copied?'복사했어요':'오류 내용 복사하기'}</Btn>
          <Btn v="gray" sx={{width:'100%',marginTop:8}} onClick={()=>location.reload()}>새로고침</Btn>
          <Btn v="gray" sx={{width:'100%',marginTop:8}} onClick={()=>{try{signOut();}catch(e){} location.href=location.pathname;}}>로그아웃하고 처음부터</Btn>
        </div>
      </div>
    );
  }
}

// React 가 아예 못 뜨는 경우(스크립트 오류)까지 화면에 남긴다
function showFatal(msg){
  const root=document.getElementById('root');
  if(!root||root.dataset.fatal)return;
  root.dataset.fatal='1';
  root.innerHTML='<div style="padding:24px;font:13px/1.7 -apple-system,sans-serif;color:#B42318">'
    +'<b style="display:block;font-size:15px;margin-bottom:8px;color:#1B1B22">앱을 불러오지 못했어요</b>'
    +'<pre style="white-space:pre-wrap;word-break:break-all;background:#FEF2F2;padding:10px;border-radius:8px;font-size:11px">'
    +String(msg).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre></div>';
}
window.addEventListener('error',e=>{if(!document.getElementById('root').children.length)showFatal(`${e.message}\n${e.filename||''}:${e.lineno||''}`);});
window.addEventListener('unhandledrejection',e=>{const r=e.reason;console.error('unhandled:',r);});

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
</body>
</html>
