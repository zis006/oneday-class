/* ── Cloudinary 설정 ─────────────────────────────────────────── */
const CLOUDINARY_CLOUD = 'r9jlchwx';
const CLOUDINARY_PRESET = 'oneday-class';
const DOC = () => db && db.collection('od_club').doc('shared');

async function fbGet(){
  if(!db){try{return JSON.parse(localStorage.getItem('od_shared')||'{}');}catch{return {};}}
  try{const s=await DOC().get();return s.exists?s.data():{};}catch{return {};}
}
async function fbSet(key,val){
  if(!db){const cur=JSON.parse(localStorage.getItem('od_shared')||'{}');localStorage.setItem('od_shared',JSON.stringify({...cur,[key]:val}));return;}

function fbListen(cb){

/* ── 사진 업로드 (Cloudinary) ───────────────────────────────── */
async function uploadPhoto(file) {
  if(file.size > 10*1024*1024){alert('10MB 이하 사진만 올릴 수 있어요');return null;}
  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST', body: form
    });
    const data = await res.json();
    if(data.secure_url) return data.secure_url;
    throw new Error(data.error?.message || '업로드 실패');
  } catch(e) {
    console.error(e);
    alert('사진 업로드 실패: ' + e.message);
    return null;
  }
}

/* ── 네이버 지도 링크 → 정보 자동추출 ───────────────────────── */
async function fetchNaverInfo(url) {
  if(!url || (!url.includes('naver.me') && !url.includes('map.naver.com'))) return null;
  try {
    const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy, {signal: AbortSignal.timeout(6000)});
    const data = await res.json();
    const html = data.contents || '';
    const getOG = (prop) => {
      const m = html.match(new RegExp(`<meta[^>]*property="${prop}"[^>]*content="([^"]+)"`, 'i')) ||
                html.match(new RegExp(`<meta[^>]*content="([^"]+)"[^>]*property="${prop}"`, 'i'));
      return m ? m[1].replace(/&amp;/g,'&').replace(/&#39;/g,"'") : '';
    };
    const name = getOG('og:title');
    const desc = getOG('og:description'); // 주소 포함된 경우 많음
    return name ? {name, address: desc} : null;
  } catch(e) { console.warn('네이버 정보 가져오기 실패:', e); return null; }
}

const getNick  = () => localStorage.getItem('od_nick')||'';

/* ── Utilities ───────────────────────────────────────────────── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const WD=['일','월','화','수','목','금','토'];
const SM={당장:2,언젠가:1,안함:-1,절대안함:-2};
const calcScore=c=>Object.values(c.votes||{}).reduce((s,v)=>s+(SM[v]||0),0);
const CATS=['도예','요리','베이킹','공예','그림','플라워','캘리','가죽','기타'];
const CE={도예:'🏺',요리:'🍳',베이킹:'🥐',공예:'✂️',그림:'🎨',플라워:'💐',캘리:'✒️',가죽:'👜',기타:'✨'};
const VOPTS=[
  {k:'당장',label:'당장하고싶다',e:'🔥',color:'#e53e3e',bg:'#FFF5F5',border:'#FED7D7'},
  {k:'언젠가',label:'언젠가하고싶다',e:'👍',color:'#6c5ce7',bg:'#FAF5FF',border:'#E9D8FD'},
  {k:'안함',label:'안하고싶다',e:'😐',color:'#d97706',bg:'#FFFBEB',border:'#FDE68A'},
  {k:'절대안함',label:'절대안하고싶다',e:'🙅',color:'#718096',bg:'#F7FAFC',border:'#E2E8F0'},
];
function nthWkday(year,month,wday,n){
  const base=new Date(year,month,1);const[y,m]=[base.getFullYear(),base.getMonth()];let c=0;
  for(let d=1;d<=31;d++){const dt=new Date(y,m,d);if(dt.getMonth()!==m)break;if(dt.getDay()===wday&&++c===n)return dt;}
  return null;
}
function getNextClassDate(){const now=new Date();const[y,m]=[now.getFullYear(),now.getMonth()];const cur=nthWkday(y,m,3,2);return(cur&&cur>now)?cur:nthWkday(y,m+1,3,2);}
const fDate=d=>d?`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`:'';
const toYM=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:'';
const ymLabel=ym=>{if(!ym)return'';const[y,m]=ym.split('-');return`${y}년 ${+m}월`;};
const displayDate=d=>{
  if(!d)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)){const dt=new Date(d+'T00:00:00');return`${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${WD[dt.getDay()]})`;}
  return d;
};
const daysUntil=d=>{const a=new Date();a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/86400000);};

const toISO=d=>{if(!d)return'';return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};

/* ── 뒷풀이 정규화 (구버전 호환) ─────────────────────────────── */
function getAfterParties(rec){

}

/* ── Base styles ─────────────────────────────────────────────── */
const IS={border:'1.5px solid #E2D9FF',borderRadius:10,padding:'9px 12px',fontSize:14,width:'100%',boxSizing:'border-box',outline:'none',fontFamily:'inherit',color:'#1a1a2e',background:'#FAFAF8'};

/* ── UI atoms ────────────────────────────────────────────────── */
function FI({label,...p}){return <div style={{display:'flex',flexDirection:'column',gap:5}}>{label&&<label style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>{label}</label>}<input style={IS} {...p}/></div>;}
function FT({label,rows=3,...p}){return <div style={{display:'flex',flexDirection:'column',gap:5}}>{label&&<label style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>{label}</label>}<textarea style={{...IS,resize:'none'}} rows={rows} {...p}/></div>;}
function Btn({children,v='pri',sx={},...p}){

function Stars({value=0,onChange,size=18}){return <div style={{display:'flex',gap:2}}>{[1,2,3,4,5].map(i=><button key={i} onClick={()=>onChange?.(i)} style={{background:'none',border:'none',cursor:onChange?'pointer':'default',padding:1}}><svg width={size} height={size} viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill={i<=value?'#FBBF24':'none'} stroke={i<=value?'#FBBF24':'#D1D5DB'} strokeWidth="1.5" strokeLinejoin="round"/></svg></button>)}</div>;}
function Modal({title,onClose,children}){return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}}><div style={{background:'#fff',width:'100%',maxWidth:480,borderRadius:20,maxHeight:'90vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,.2)'}}><div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:'1.5px solid #F0EDFF',position:'sticky',top:0,background:'#fff'}}><span style={{fontWeight:800,fontSize:15,color:'#1a1a2e'}}>{title}</span><button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'#bbb',fontSize:26,lineHeight:1,padding:4}}>×</button></div><div style={{padding:'16px 20px 40px'}}>{children}</div></div></div>;}
function BackBtn({onClick}){return <button onClick={onClick} style={{display:'flex',alignItems:'center',gap:6,background:'none',border:'none',cursor:'pointer',color:'#6c5ce7',fontWeight:700,fontSize:14,padding:'0 0 16px',fontFamily:'inherit'}}>← 돌아가기</button>;}
function Empty({emoji,title,sub}){return <div style={{textAlign:'center',padding:'52px 20px'}}><div style={{fontSize:44,marginBottom:10}}>{emoji}</div><div style={{fontWeight:700,color:'#374151',marginBottom:4}}>{title}</div><div style={{fontSize:13,color:'#9CA3AF'}}>{sub}</div></div>;}
function ScoreBadge({score}){const c=score>0?'#6c5ce7':score<0?'#EF4444':'#94A3B8';const bg=score>0?'#F0EDFF':score<0?'#FEF2F2':'#F1F5F9';return <span style={{fontWeight:800,fontSize:12,color:c,background:bg,borderRadius:20,padding:'3px 10px'}}>{score>0?'+':''}{score}점</span>;}
function VoteBreakdown({votes}){const cnt={};Object.values(votes||{}).forEach(v=>{cnt[v]=(cnt[v]||0)+1;});const items=VOPTS.filter(o=>cnt[o.k]);if(!items.length)return null;return <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>{items.map(o=><span key={o.k} style={{fontSize:11,background:o.bg,color:o.color,borderRadius:20,padding:'2px 8px',border:`1px solid ${o.border}`,fontWeight:700}}>{o.e} {cnt[o.k]}</span>)}</div>;}

/* ── PlaceSearch (카카오맵 SDK) ──────────────────────────────── */
function PlaceSearch({onSelect}){
  const [q,setQ]=useState('');
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [open,setOpen]=useState(false);
  const ref=useRef();
  const timerRef=useRef(null);

  useEffect(()=>{
    function onClickOut(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener('mousedown',onClickOut);
    return()=>document.removeEventListener('mousedown',onClickOut);
  },[]);

  function search(keyword){
    if(!keyword.trim()){setResults([]);setOpen(false);return;}
    if(!window.kakao||!window.kakao.maps){setResults([]);return;}
    setLoading(true);
    const ps=new kakao.maps.services.Places();
    ps.keywordSearch(keyword,(data,status)=>{
      setLoading(false);
      if(status===kakao.maps.services.Status.OK){
        setResults(data.slice(0,7));
        setOpen(true);
      } else {
        setResults([]);
        setOpen(true);
      }
    });
  }

  function onChange(e){
    const val=e.target.value;
    setQ(val);
    if(timerRef.current) clearTimeout(timerRef.current);
    timerRef.current=setTimeout(()=>search(val),350);
  }

  function select(r){
    onSelect({
      name: r.place_name,
      address: r.road_address_name||r.address_name,
      naverUrl: `https://map.naver.com/v5/search/${encodeURIComponent(r.place_name)}`,
    });
    setQ('');setResults([]);setOpen(false);
  }

  return(
    <div ref={ref} style={{position:'relative'}}>
      <div style={{position:'relative'}}>
        <input value={q} onChange={onChange} placeholder="🔍 장소명 검색 (예: 홍대 도예공방)" style={{...IS,paddingRight:36}}/>
        {loading&&<span style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'#bbb'}}>⏳</span>}
      </div>
      {open&&results.length>0&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'#fff',border:'1.5px solid #E2D9FF',borderRadius:12,zIndex:200,maxHeight:280,overflowY:'auto',boxShadow:'0 8px 24px rgba(108,92,231,.12)'}}>
          {results.map((r,i)=>(
            <button key={i} onClick={()=>select(r)}
              style={{width:'100%',padding:'10px 14px',background:'none',border:'none',borderBottom:i<results.length-1?'1px solid #F0EDFF':'none',cursor:'pointer',textAlign:'left',fontFamily:'inherit'}}>
              <div style={{fontWeight:700,fontSize:14,color:'#1a1a2e',marginBottom:2}}>{r.place_name}</div>
              <div style={{fontSize:12,color:'#64748B',marginBottom:1}}>{r.road_address_name||r.address_name}</div>
              <div style={{fontSize:11,color:'#a0aec0'}}>{(r.category_name||'').split(' > ').pop()||''}</div>
            </button>
          ))}
        </div>
      )}
      {open&&results.length===0&&!loading&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'#fff',border:'1.5px solid #E2D9FF',borderRadius:12,zIndex:200,padding:'12px 14px',fontSize:13,color:'#bbb',boxShadow:'0 8px 24px rgba(0,0,0,.08)'}}>
          검색 결과가 없어요
        </div>
      )}
    </div>
  );
}

/* ── PhotoUploadBtn ──────────────────────────────────────────── */
function PhotoUploadBtn({onUpload,uploading,label='📷 사진 추가'}){
  const ref=useRef();
  async function handle(e){
    const file=e.target.files[0];if(!file)return;
    const url=await onUpload(file);
    e.target.value='';
    return url;
  }
  return(
    <label style={{display:'inline-flex',alignItems:'center',gap:6,borderRadius:12,padding:'8px 16px',fontSize:13,fontWeight:700,cursor:'pointer',background:'#F0EDFF',color:'#6c5ce7',border:'none',userSelect:'none'}}>
      {uploading?'⏳ 업로드 중...':label}
      <input ref={ref} type="file" accept="image/*" style={{display:'none'}} onChange={handle} disabled={uploading}/>
    </label>
  );
}

        </div>
      ))}

}

/* ── CandidateCard ───────────────────────────────────────────── */
function CandidateCard({cand,onClick,myVote,rank}){

    <div onClick={onClick} style={{...CS,cursor:'pointer',position:'relative'}}>
      {rank!=null&&score>0&&<span style={{position:'absolute',top:-7,left:14,fontSize:11,fontWeight:800,borderRadius:10,padding:'2px 8px',background:['#FFD700','#C0C0C0','#CD7F32'][rank]||'#ddd',color:'#fff',zIndex:1}}>{['🥇1위','🥈2위','🥉3위'][rank]}</span>}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:4}}>
            {cand.cat&&<span style={{fontSize:11,background:'#F0EDFF',color:'#6c5ce7',borderRadius:20,padding:'2px 8px',fontWeight:700}}>{CE[cand.cat]} {cand.cat}</span>}
            <span style={{fontWeight:800,fontSize:15,color:'#1a1a2e'}}>{cand.name}</span>
          </div>
          {cand.price>0&&<div style={{fontSize:13,color:'#64748B'}}>💰 {Number(cand.price).toLocaleString()}원/인</div>}
          {cand.address&&<div style={{fontSize:13,color:'#94A3B8',marginTop:2}}>📍 {cand.address}</div>}
          <VoteBreakdown votes={cand.votes}/>
        </div>
        <div style={{textAlign:'right',flexShrink:0,display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
          <ScoreBadge score={score}/>
          {myVote&&<span style={{fontSize:11,color:'#6c5ce7',fontWeight:700}}>{(VOPTS.find(o=>o.k===myVote)||{}).e}</span>}
        </div>
      </div>
    </div>
  );
}

/* ── CandidateDetail ─────────────────────────────────────────── */
function CandidateDetail({cand,onUpdate,nick,onBack,inModal}){
  const myVote=cand.votes?.[nick]||null;
  const score=calcScore(cand);
  const totalVoters=Object.keys(cand.votes||{}).length;
  const [showEdit,setShowEdit]=useState(false);
  function castVote(key){
    if(!nick.trim()){alert('닉네임을 먼저 설정해주세요 (우측 상단)');return;}
    onUpdate({...cand,votes:{...(cand.votes||{}),[nick.trim()]:key}});
  }
  return(
    <React.Fragment>
    <div>
      {!inModal&&<BackBtn onClick={onBack}/>}
      <div style={{...CS,marginBottom:14}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10,marginBottom:14}}>
          <div>
            {cand.cat&&<span style={{fontSize:12,background:'#F0EDFF',color:'#6c5ce7',borderRadius:20,padding:'3px 12px',fontWeight:700,display:'inline-block',marginBottom:8}}>{CE[cand.cat]} {cand.cat}</span>}
            <h2 style={{fontWeight:900,fontSize:20,color:'#1a1a2e',margin:0,lineHeight:1.3}}>{cand.name}</h2>
          <div style={{display:'flex',gap:6,marginTop:10}}>
            <Btn v="ghost" sx={{padding:'5px 12px',fontSize:12}} onClick={()=>setShowEdit(true)}>✏️ 수정</Btn>
            
          </div>
          </div>
          <div style={{textAlign:'center',background:score>0?'#F0EDFF':score<0?'#FEF2F2':'#F1F5F9',borderRadius:14,padding:'10px 14px',minWidth:64,flexShrink:0}}>
            <div style={{fontWeight:900,fontSize:24,color:score>0?'#6c5ce7':score<0?'#EF4444':'#94A3B8',lineHeight:1}}>{score>0?'+':''}{score}</div>
            <div style={{fontSize:11,color:'#94A3B8',fontWeight:600,marginTop:2}}>점수</div>
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {cand.activity&&<div style={{fontSize:14,color:'#374151',lineHeight:1.6,background:'#FAFAF8',borderRadius:10,padding:'10px 12px'}}>📝 {cand.activity}</div>}
          {cand.price>0&&<div style={{fontSize:14,color:'#374151'}}>💰 <strong>{Number(cand.price).toLocaleString()}원</strong> / 1인</div>}
          {cand.address&&<div style={{fontSize:14,color:'#374151'}}>📍 {cand.address}</div>}
          {cand.naverUrl&&<a href={cand.naverUrl} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:13,color:'#03C75A',fontWeight:700,textDecoration:'none',background:'#F0FFF5',padding:'8px 14px',borderRadius:10}}>🗺️ 네이버 지도에서 보기</a>}
          {cand.addedBy&&<div style={{fontSize:12,color:'#bbb'}}>by {cand.addedBy}</div>}
        </div>
      </div>
      <div style={CS}>
        <div style={{fontWeight:800,fontSize:15,color:'#1a1a2e',marginBottom:2}}>이 클래스 어때요?</div>
        <div style={{fontSize:12,color:'#94A3B8',marginBottom:16}}>{totalVoters}명 참여</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
          {VOPTS.map(o=>{const isMe=myVote===o.k;const cnt=Object.values(cand.votes||{}).filter(v=>v===o.k).length;return(
            <button key={o.k} onClick={()=>castVote(o.k)} style={{padding:'14px 10px',borderRadius:14,cursor:'pointer',fontFamily:'inherit',transition:'all .15s',border:isMe?`2px solid ${o.color}`:`1.5px solid ${o.border}`,background:isMe?o.bg:'#FAFAF8',display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
              <span style={{fontSize:26}}>{o.e}</span>
              <span style={{fontSize:11,fontWeight:800,color:isMe?o.color:'#374151',lineHeight:1.3,textAlign:'center'}}>{o.label}</span>
              {cnt>0&&<span style={{fontSize:13,fontWeight:800,color:isMe?o.color:'#94A3B8'}}>{cnt}명</span>}
            </button>
          );})}
        </div>
        {Object.keys(cand.votes||{}).length>0&&(
          <div style={{background:'#FAFAF8',borderRadius:12,padding:'12px 14px'}}>
            <div style={{fontSize:12,fontWeight:700,color:'#94A3B8',marginBottom:8}}>참여자</div>
            {VOPTS.map(o=>{const vs=Object.entries(cand.votes||{}).filter(([,v])=>v===o.k).map(([k])=>k);return vs.length?<div key={o.k} style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}><span style={{fontSize:13}}>{o.e}</span><span style={{fontSize:13,color:'#64748B'}}>{vs.join(', ')}</span></div>:null;})}
          </div>
        )}
      </div>
    </div>
    {showEdit&&<EditCandidateModal cand={cand} onSave={u=>{onUpdate(u);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </React.Fragment>
  );
}

/* ── RecordCard ──────────────────────────────────────────────── */
function RecordCard({rec,onClick}){
  const reviews=rec.reviews||[];
  const avg=reviews.length?(reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1):null;
  const isStub=rec.isStub&&!rec.activity;
  const photoCount=(rec.photos||[]).length;
  const afterParties=getAfterParties(rec);
  return(
    <div onClick={onClick} style={{...CS,cursor:'pointer',borderColor:isStub?'#FDE68A':'#F0EDFF',background:isStub?'#FFFDF5':'#fff'}}>
      <div style={{display:'flex',gap:8,marginBottom:8,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:12,background:'#6c5ce7',color:'#fff',borderRadius:20,padding:'3px 12px',fontWeight:700}}>{ymLabel(rec.month)}</span>
        {rec.cat&&<span style={{fontSize:11,background:'#F0EDFF',color:'#6c5ce7',borderRadius:20,padding:'2px 9px',fontWeight:600}}>{CE[rec.cat]} {rec.cat}</span>}
        {isStub&&<span style={{fontSize:11,background:'#FEF3C7',color:'#D97706',borderRadius:20,padding:'2px 9px',fontWeight:700}}>✏️ 작성 중</span>}
      </div>
      <div style={{fontWeight:800,fontSize:16,color:'#1a1a2e',marginBottom:6}}>{rec.name}</div>
      {rec.date&&<div style={{fontSize:12,color:'#94A3B8',marginBottom:6}}>📅 {displayDate(rec.date)}</div>}
      {isStub
        ?<div style={{fontSize:13,color:'#D97706'}}>클래스 후 활동내용·사진·리뷰를 여기에 남겨주세요 →</div>
        :<div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          {avg?<><span style={{color:'#FBBF24'}}>★</span><span style={{fontSize:14,fontWeight:700,color:'#374151'}}>{avg}</span><span style={{fontSize:12,color:'#bbb'}}>({reviews.length}개)</span></>:<span style={{fontSize:12,color:'#bbb'}}>리뷰 없음</span>}
          {rec.price>0&&<span style={{fontSize:12,color:'#64748B'}}>💰 {Number(rec.price).toLocaleString()}원</span>}
          {photoCount>0&&<span style={{fontSize:12,color:'#6c5ce7'}}>📷 {photoCount}장</span>}
          {afterParties.length>0&&<span style={{fontSize:12,color:'#d97706'}}>🍻 {afterParties.length}차 뒷풀이</span>}
        </div>
      }
    </div>
  );
}

/* ── RecordDetail ────────────────────────────────────────────── */
function RecordDetail({rec,onUpdate,nick,onBack}){
  const [showEdit,setShowEdit]=useState(false);
  const [showAddParty,setShowAddParty]=useState(false);
  const [newParty,setNewParty]=useState({name:'',address:'',url:''});
  const [uploadingPhoto,setUploadingPhoto]=useState(false);
  const [showImpForm,setShowImpForm]=useState(false);
  const [impForm,setImpForm]=useState({nick:nick||'',text:''});
  const [showReviewForm,setShowReviewForm]=useState(false);
  const [rf,setRf]=useState({nick:nick||'',rating:5,text:'',photo:null});
  const [uploadingReviewPhoto,setUploadingReviewPhoto]=useState(false);

  const reviews=rec.reviews||[];
  const impressions=rec.impressions||[];
  const photos=rec.photos||[];
  const afterParties=getAfterParties(rec);
  const avg=reviews.length?(reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1):null;

  function update(changes){onUpdate({...rec,...changes});}
  function addAfterParty(){
    if(!newParty.name.trim()&&!newParty.address.trim())return;
    update({afterParties:[...afterParties,{...newParty,id:uid()}]});
    setNewParty({name:'',address:'',url:''});setShowAddParty(false);
  }

  // 활동 사진 업로드
  async function handlePhotoUpload(file){
    setUploadingPhoto(true);
    const url=await uploadPhoto(file);
    if(url) update({photos:[...photos,url]});
    setUploadingPhoto(false);
    return url;
  }
  function deletePhoto(i){
    if(!confirm('이 사진을 삭제할까요?'))return;
    update({photos:photos.filter((_,idx)=>idx!==i)});
  }

  // 소감 추가
  function addImpression(){
    if(!impForm.nick.trim()){alert('닉네임을 입력해주세요');return;}
    if(!impForm.text.trim()){alert('소감을 작성해주세요');return;}
    const imp={id:uid(),author:impForm.nick.trim(),text:impForm.text.trim(),createdAt:Date.now()};
    update({impressions:[...impressions,imp]});
    setShowImpForm(false);setImpForm(p=>({...p,text:''}));
  }
  function delImpression(id){if(!confirm('삭제할까요?'))return;update({impressions:impressions.filter(x=>x.id!==id)});}

  // 리뷰 사진 업로드
  async function handleReviewPhoto(file){
    setUploadingReviewPhoto(true);
    const url=await uploadPhoto(file);
    if(url) setRf(p=>({...p,photo:url}));
    setUploadingReviewPhoto(false);
    return url;
  }

  // 리뷰 등록
  function addReview(){
    if(!rf.nick.trim()){alert('닉네임을 입력해주세요');return;}
    if(!rf.text.trim()){alert('리뷰를 작성해주세요');return;}
    const rv={id:uid(),author:rf.nick.trim(),rating:rf.rating,text:rf.text.trim(),photo:rf.photo||null,createdAt:Date.now()};
    update({reviews:[...reviews,rv]});
    setShowReviewForm(false);setRf(p=>({...p,text:'',rating:5,photo:null}));
  }
  function delReview(id){if(!confirm('삭제할까요?'))return;update({reviews:reviews.filter(r=>r.id!==id)});}

  const secTitle=(t,sub)=>(
    <div style={{marginBottom:14}}>
      <div style={{fontWeight:800,fontSize:15,color:'#1a1a2e'}}>{t}</div>
      {sub&&<div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>{sub}</div>}
    </div>
  );

  return(
    <React.Fragment>
    <div>
      <BackBtn onClick={onBack}/>

      {/* 기본 정보 */}
      <div style={{...CS,marginBottom:14}}>
        <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
          <span style={{fontSize:12,background:'#6c5ce7',color:'#fff',borderRadius:20,padding:'3px 12px',fontWeight:700}}>{ymLabel(rec.month)}</span>
          {rec.cat&&<span style={{fontSize:11,background:'#F0EDFF',color:'#6c5ce7',borderRadius:20,padding:'2px 9px',fontWeight:600}}>{CE[rec.cat]} {rec.cat}</span>}
          {avg&&<span style={{fontSize:12,color:'#64748B'}}>★ {avg} ({reviews.length})</span>}
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <h2 style={{fontWeight:900,fontSize:20,color:'#1a1a2e',margin:0}}>{rec.name}</h2>
          <div style={{display:'flex',gap:6}}>
            <Btn v="ghost" sx={{padding:'5px 12px',fontSize:12}} onClick={()=>setShowEdit(true)}>✏️ 수정</Btn>
            
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {rec.date&&<InfoRow icon="📅" label="날짜" val={displayDate(rec.date)}/>}
          {rec.activity&&<InfoRow icon="📝" label="활동 내용" val={rec.activity}/>}
          {rec.price>0&&<InfoRow icon="💰" label="금액 (1인)" val={`${Number(rec.price).toLocaleString()}원`}/>}
          {rec.address&&(
            <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
              <span style={{fontSize:16,flexShrink:0}}>📍</span>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:'#6B7280',marginBottom:2}}>주소</div>
                <div style={{fontSize:14,color:'#374151'}}>{rec.address}</div>
                {rec.naverUrl&&<a href={rec.naverUrl} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:12,color:'#03C75A',fontWeight:700,textDecoration:'none',marginTop:4}}>🗺️ 네이버 지도</a>}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* 활동 사진 */}
      <div style={{...CS,marginBottom:14}}>
        {secTitle('📷 활동 사진',`${photos.length}장`)}
        <PhotoGrid photos={photos} onDelete={deletePhoto}/>
        <PhotoUploadBtn onUpload={handlePhotoUpload} uploading={uploadingPhoto}/>
      </div>

      {/* 뒷풀이 장소 */}
      <div style={{marginBottom:14}}>
        {afterParties.map((p,i)=>(
          <div key={p.id||i} style={{background:'#FFFBEB',border:'1.5px solid #FDE68A',borderRadius:16,padding:'14px 16px',marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:13,color:'#92400E',marginBottom:8}}>🍻 {i+1}차 뒷풀이</div>
            {p.name&&<div style={{fontWeight:700,fontSize:15,color:'#374151',marginBottom:4}}>{p.name}</div>}
            {p.address&&<div style={{fontSize:13,color:'#64748B',marginBottom:4}}>📍 {p.address}</div>}
            {p.url&&<a href={p.url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:13,color:'#03C75A',fontWeight:700,textDecoration:'none'}}>🗺️ 네이버 지도</a>}
          </div>
        ))}
        {showAddParty?(
          <div style={{background:'#FFFBEB',border:'1.5px solid #FDE68A',borderRadius:16,padding:'14px 16px'}}>
            <div style={{fontWeight:800,fontSize:13,color:'#92400E',marginBottom:10}}>🍻 {afterParties.length+1}차 뒷풀이</div>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:10}}>
              <FI placeholder="장소 이름" value={newParty.name} onChange={e=>setNewParty(p=>({...p,name:e.target.value}))}/>
              <FI placeholder="주소" value={newParty.address} onChange={e=>setNewParty(p=>({...p,address:e.target.value}))}/>
              <FI placeholder="🗺️ 네이버 지도 링크" value={newParty.url} onChange={e=>setNewParty(p=>({...p,url:e.target.value}))}/>
            </div>
            <div style={{display:'flex',gap:8}}>
              <Btn sx={{flex:1,justifyContent:'center'}} onClick={addAfterParty}>추가</Btn>
              <Btn v="gray" onClick={()=>{setShowAddParty(false);setNewParty({name:'',address:'',url:''});}}>취소</Btn>
            </div>
          </div>
        ):(
          <Btn v="amber" sx={{width:'100%',justifyContent:'center'}} onClick={()=>setShowAddParty(true)}>🍻 뒷풀이 장소 추가</Btn>
        )}
      </div>

      {/* 활동 소감 */}
      <div style={{...CS,marginBottom:14}}>
        {secTitle('💭 활동 소감',`${impressions.length}개 소감`)}
        {impressions.length===0&&!showImpForm&&<div style={{fontSize:13,color:'#bbb',marginBottom:14}}>오늘 활동 어떠셨나요? 소감을 남겨주세요!</div>}
        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:14}}>
          {impressions.map(imp=>(
            <div key={imp.id} style={{background:'#F8F7FF',borderRadius:14,padding:'12px 14px',border:'1.5px solid #EDE8FF'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                <span style={{fontWeight:800,fontSize:14,color:'#374151'}}>{imp.author}</span>
                <button onClick={()=>delImpression(imp.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#ddd',fontSize:20,lineHeight:1,padding:4}}>×</button>
              </div>
              <div style={{fontSize:14,color:'#4B5563',lineHeight:1.6}}>{imp.text}</div>
            </div>
          ))}
        </div>
        {showImpForm
          ?<div style={{background:'#F0EDFF',borderRadius:14,padding:14,display:'flex',flexDirection:'column',gap:10}}>
            <FI placeholder="닉네임" value={impForm.nick} onChange={e=>setImpForm(p=>({...p,nick:e.target.value}))}/>
            <FT placeholder="오늘 활동 소감을 자유롭게 써주세요 ✍️" rows={3} value={impForm.text} onChange={e=>setImpForm(p=>({...p,text:e.target.value}))}/>
            <div style={{display:'flex',gap:8}}><Btn sx={{flex:1,justifyContent:'center'}} onClick={addImpression}>등록</Btn><Btn v="gray" onClick={()=>setShowImpForm(false)}>취소</Btn></div>
          </div>
          :<Btn v="ghost" sx={{width:'100%',justifyContent:'center'}} onClick={()=>setShowImpForm(true)}>✏️ 소감 남기기</Btn>
        }
      </div>

      {/* 리뷰 (별점) */}
      <div style={CS}>
        {secTitle('⭐ 리뷰',`${reviews.length}개${avg?` · 평균 ★${avg}`:''}`)}
        {reviews.length===0&&!showReviewForm&&<div style={{fontSize:13,color:'#bbb',marginBottom:14}}>별점과 함께 리뷰를 남겨주세요!</div>}
        <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:14}}>
          {reviews.map(rv=>(
            <div key={rv.id} style={{background:'#FAFAF8',borderRadius:14,padding:'12px 14px',border:'1.5px solid #F0EDFF'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontWeight:800,fontSize:14,color:'#374151'}}>{rv.author}</span>
                  <Stars value={rv.rating} size={13}/>
                </div>
                <button onClick={()=>delReview(rv.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#ddd',fontSize:20,lineHeight:1,padding:4}}>×</button>
              </div>
              <div style={{fontSize:14,color:'#4B5563',lineHeight:1.5,marginBottom:rv.photo?8:0}}>{rv.text}</div>
              {rv.photo&&(
                <img src={rv.photo} style={{width:'100%',maxHeight:200,objectFit:'cover',borderRadius:10,cursor:'pointer',marginTop:4}} onClick={()=>window.open(rv.photo,'_blank')}/>
              )}
            </div>
          ))}
        </div>
        {showReviewForm
          ?<div style={{background:'#F0EDFF',borderRadius:14,padding:14,display:'flex',flexDirection:'column',gap:12}}>
            <FI placeholder="닉네임" value={rf.nick} onChange={e=>setRf(p=>({...p,nick:e.target.value}))}/>
            <div><div style={{fontSize:12,fontWeight:700,color:'#6c5ce7',marginBottom:8}}>별점</div><Stars value={rf.rating} onChange={r=>setRf(p=>({...p,rating:r}))} size={28}/></div>
            <FT placeholder="이번 클래스 어떠셨나요? 😊" value={rf.text} onChange={e=>setRf(p=>({...p,text:e.target.value}))}/>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <PhotoUploadBtn onUpload={handleReviewPhoto} uploading={uploadingReviewPhoto} label="📷 사진 첨부"/>
              {rf.photo&&<div style={{position:'relative',width:56,height:56,borderRadius:10,overflow:'hidden',flexShrink:0}}><img src={rf.photo} style={{width:'100%',height:'100%',objectFit:'cover'}}/><button onClick={()=>setRf(p=>({...p,photo:null}))} style={{position:'absolute',top:2,right:2,background:'rgba(0,0,0,.5)',border:'none',borderRadius:'50%',color:'#fff',width:18,height:18,fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>×</button></div>}
            </div>
            <div style={{display:'flex',gap:8}}><Btn sx={{flex:1,justifyContent:'center'}} onClick={addReview}>등록</Btn><Btn v="gray" onClick={()=>setShowReviewForm(false)}>취소</Btn></div>
          </div>
          :<Btn v="out" sx={{width:'100%',justifyContent:'center'}} onClick={()=>setShowReviewForm(true)}>⭐ 리뷰 쓰기</Btn>
        }
      </div>
    </div>
    {showEdit&&<EditRecordModal rec={rec} onSave={u=>{onUpdate(u);setShowEdit(false);}} onClose={()=>setShowEdit(false)}/>}
    </React.Fragment>
  );
}

/* ── AddCandidateModal ───────────────────────────────────────── */
function AddCandidateModal({onAdd,onClose}){
  const [f,setF]=useState({name:'',cat:'',activity:'',price:'',address:'',naverUrl:'',addedBy:''});
  const [fetching,setFetching]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  async function handleNaverUrl(url){
    set('naverUrl',url);
    if(!url.includes('naver')) return;
    setFetching(true);
    const info=await fetchNaverInfo(url);
    if(info){setF(p=>({...p,naverUrl:url,name:p.name||info.name,address:p.address||info.address}));}
    setFetching(false);
  }
  function submit(){if(!f.name.trim()){alert('클래스 이름을 입력해주세요');return;}onAdd({id:uid(),...f,name:f.name.trim(),price:f.price?Number(String(f.price).replace(/,/g,'')):0,votes:{},addedAt:Date.now()});onClose();}
  return(
    <Modal title="후보 추가하기" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div>
          <label style={{fontSize:12,fontWeight:700,color:'#6B7280',display:'block',marginBottom:6}}>🔍 장소 검색 <span style={{fontWeight:400,color:'#6c5ce7'}}>(선택하면 자동입력)</span></label>
          <PlaceSearch onSelect={info=>setF(p=>({...p,name:p.name||info.name,address:p.address||info.address,naverUrl:p.naverUrl||info.naverUrl}))}/>
        </div>

/* ── AddRecordModal ──────────────────────────────────────────── */
function AddRecordModal({candidates,onAdd,onClose}){
  const now=new Date();
  const initDate=()=>{const d=nthWkday(now.getFullYear(),now.getMonth(),3,2);return d?toISO(d):'';};
  const [f,setF]=useState({candId:'',name:'',cat:'',month:toYM(now),date:initDate(),activity:'',price:'',address:'',naverUrl:''});
  const [afterParties,setAfterParties]=useState([]);
  const [fetching,setFetching]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  async function handleNaverUrl(url){
    set('naverUrl',url);
    if(!url.includes('naver')) return;
    setFetching(true);
    const info=await fetchNaverInfo(url);
    if(info){setF(p=>({...p,naverUrl:url,name:p.name||info.name,address:p.address||info.address}));}
    setFetching(false);
  }

  function selectCand(cid){
    const c=candidates.find(x=>x.id===cid);
    if(c) setF(p=>({...p,candId:cid,name:c.name,cat:c.cat||'',activity:c.activity||'',price:c.price?String(c.price):'',address:c.address||'',naverUrl:c.naverUrl||''}));
    else set('candId',cid);
  }
  function onDateChange(d){set('date',d);set('month',d.slice(0,7));}
  function addParty(){setAfterParties(p=>[...p,{id:uid(),name:'',address:'',url:''}]);}
  function removeParty(id){setAfterParties(p=>p.filter(x=>x.id!==id));}
  function updateParty(id,k,v){setAfterParties(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));}

  function submit(){
    if(!f.name.trim()){alert('클래스 이름을 입력해주세요');return;}
    onAdd({id:uid(),...f,name:f.name.trim(),price:f.price?Number(String(f.price).replace(/,/g,'')):0,afterParties,photos:[],impressions:[],reviews:[],createdAt:Date.now()});
    onClose();
  }
  return(
    <Modal title="기록 추가하기" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div><label style={{fontSize:12,fontWeight:700,color:'#6B7280',display:'block',marginBottom:6}}>후보에서 불러오기 (선택)</label><select value={f.candId} onChange={e=>selectCand(e.target.value)} style={{...IS,color:f.candId?'#1a1a2e':'#9CA3AF'}}><option value="">직접 입력</option>{candidates.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
        <div>
          <label style={{fontSize:12,fontWeight:700,color:'#6B7280',display:'block',marginBottom:6}}>🔍 장소 검색 <span style={{fontWeight:400,color:'#6c5ce7'}}>(선택하면 자동입력)</span></label>
          <PlaceSearch onSelect={info=>setF(p=>({...p,name:p.name||info.name,address:p.address||info.address,naverUrl:p.naverUrl||info.naverUrl}))}/>
        </div>
        <FI label="클래스 이름 *" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="예: 홍대 도자기 공방"/>
        <div><div style={{fontSize:12,fontWeight:700,color:'#6B7280',marginBottom:8}}>카테고리</div><div style={{display:'flex',flexWrap:'wrap',gap:6}}>{CATS.map(c=><button key={c} onClick={()=>set('cat',f.cat===c?'':c)} style={{border:'none',borderRadius:20,padding:'4px 11px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit',background:f.cat===c?'#6c5ce7':'#F0EDFF',color:f.cat===c?'#fff':'#6c5ce7'}}>{CE[c]} {c}</button>)}</div></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div><label style={{fontSize:12,fontWeight:700,color:'#6B7280',display:'block',marginBottom:6}}>📅 날짜</label><input type="date" value={f.date} onChange={e=>onDateChange(e.target.value)} style={{...IS,width:'100%'}}/></div>
          <FI label="금액 (1인, 원)" value={f.price} onChange={e=>set('price',e.target.value)} placeholder="45000" type="number"/>
        </div>
        <FT label="활동 내용" value={f.activity} onChange={e=>set('activity',e.target.value)} placeholder="어떤 활동을 했는지 적어주세요" rows={3}/>
        <FI label="주소" value={f.address} onChange={e=>set('address',e.target.value)} placeholder="서울시 마포구 ..."/>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          <label style={{fontSize:12,fontWeight:700,color:'#6B7280'}}>🗺️ 네이버 지도 링크 <span style={{fontWeight:400,color:'#6c5ce7'}}>(붙여넣으면 이름·주소 자동입력!)</span></label>

                <span style={{fontSize:12,fontWeight:700,color:'#92400E'}}>{i+1}차 뒷풀이</span>
                <button onClick={()=>removeParty(p.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#ccc',fontSize:18,lineHeight:1}}>×</button>
              </div>

          </div>
          {confirmedCand&&<div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:12}}>{confirmedCand.activity&&<div style={{fontSize:13,color:'#64748B',background:'#FAFAF8',borderRadius:10,padding:'8px 12px'}}>📝 {confirmedCand.activity}</div>}{confirmedCand.price>0&&<div style={{fontSize:13,color:'#64748B'}}>💰 {Number(confirmedCand.price).toLocaleString()}원/인</div>}{confirmedCand.address&&<div style={{fontSize:13,color:'#64748B'}}>📍 {confirmedCand.address}</div>}{confirmedCand.naverUrl&&<a href={confirmedCand.naverUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:'#03C75A',fontWeight:700,textDecoration:'none'}}>🗺️ 네이버 지도</a>}</div>}
          <Btn onClick={()=>setShowSelect(true)} v={confirmedCand?'ghost':'pri'} sx={{width:'100%',justifyContent:'center'}}>{confirmedCand?'클래스 변경하기':'후보 목록에서 선택하기'}</Btn>
        </div>
        {showSelect&&(
          <Modal title="이달 클래스 확정하기" onClose={()=>setShowSelect(false)}>
            <div style={{fontSize:13,color:'#64748B',marginBottom:14}}>점수 순으로 정렬되어 있어요</div>
            {sorted.length===0&&<div style={{textAlign:'center',color:'#bbb',padding:'24px 0'}}>후보 목록을 먼저 채워주세요!</div>}
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {sorted.map(c=>(
                <button key={c.id} onClick={()=>{onConfirm(nextYM,c.id);setShowSelect(false);}} style={{background:confirmedId===c.id?'#F0EDFF':'#FAFAF8',border:`1.5px solid ${confirmedId===c.id?'#6c5ce7':'#F0EDFF'}`,borderRadius:14,padding:'12px 16px',cursor:'pointer',textAlign:'left',fontFamily:'inherit'}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontWeight:700,fontSize:14,color:'#1a1a2e'}}>{c.name}</span><div style={{display:'flex',alignItems:'center',gap:8}}><ScoreBadge score={calcScore(c)}/>{confirmedId===c.id&&<span style={{color:'#6c5ce7'}}>✓</span>}</div></div>
                  {c.price>0&&<div style={{fontSize:12,color:'#64748B',marginTop:3}}>💰 {Number(c.price).toLocaleString()}원</div>}
                </button>
              ))}
            </div>
          </Modal>
        )}
      </div>
      <div>
        <div style={{fontWeight:800,fontSize:16,color:'#1a1a2e',marginBottom:4}}>🗳️ 다음달 원데이클래스 투표</div>
        <div style={{fontSize:12,color:'#94A3B8',marginBottom:12}}>점수 높은 순 · 탭해서 투표하세요</div>
        {sorted.length===0
          ?<div style={{textAlign:'center',padding:'32px',background:'#fff',borderRadius:18,border:'1.5px solid #F0EDFF',color:'#bbb'}}><div style={{fontSize:36,marginBottom:8}}>📋</div><div style={{fontSize:13}}>다음 활동 후보 탭에서 클래스를 추가해보세요</div></div>
          :<div style={{display:'flex',flexDirection:'column',gap:10}}>{sorted.map((c,i)=><CandidateCard key={c.id} cand={c} onClick={()=>onCandClick(c)} myVote={c.votes?.[nick]} rank={i<3?i:null}/>)}</div>
        }
      </div>
    </div>
  );
}

/* ── 다녀온 Tab ──────────────────────────────────────────────── */
function RecordsTab({records,candidates,onSave,nick}){
  const [detail,setDetail]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  useEffect(()=>{
    const onPop=()=>setDetail(null);
    window.addEventListener('popstate',onPop);
    return()=>window.removeEventListener('popstate',onPop);
  },[]);
  function openDetail(id){window.history.pushState({detail:id,tab:'records'},'');setDetail(id);}
  if(detail){
    const rec=records.find(r=>r.id===detail);
    if(!rec){setDetail(null);return null;}
    return <div className="content-wrap"><RecordDetail rec={rec} nick={nick} onUpdate={u=>onSave(records.map(r=>r.id===u.id?u:r))} onBack={()=>window.history.back()}/></div>;
  }
  const sorted=[...records].sort((a,b)=>(a.month||'')<(b.month||'')?-1:(a.month||'')>(b.month||'')?1:0);
  return(
    <div className="content-wrap">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div><div style={{fontWeight:800,fontSize:17,color:'#1a1a2e'}}>다녀온 클래스</div><div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>총 {records.length}회</div></div>
        <Btn onClick={()=>setShowAdd(true)}>＋ 기록 추가</Btn>
      </div>
      {sorted.length===0?<Empty emoji="📖" title="아직 기록이 없어요" sub="다녀온 클래스를 기록해보세요!"/>
        :<div style={{display:'flex',flexDirection:'column',gap:12}}>{sorted.map(r=><RecordCard key={r.id} rec={r} onClick={()=>openDetail(r.id)}/>)}</div>}
      {showAdd&&<AddRecordModal candidates={candidates} onAdd={r=>onSave([...records,r])} onClose={()=>setShowAdd(false)}/>}
    </div>
  );
}

/* ── 다음 활동 후보 Tab ───────────────────────────────────────── */
function CandidatesTab({candidates,onSave,nick}){
  const [detail,setDetail]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  useEffect(()=>{
    const onPop=()=>setDetail(null);
    window.addEventListener('popstate',onPop);
    return()=>window.removeEventListener('popstate',onPop);
  },[]);
  function openDetail(id){window.history.pushState({detail:id,tab:'candidates'},'');setDetail(id);}
  if(detail){
    const cand=candidates.find(c=>c.id===detail);
    if(!cand){setDetail(null);return null;}
    return <div className="content-wrap"><CandidateDetail cand={cand} nick={nick} onUpdate={u=>onSave(candidates.map(c=>c.id===u.id?u:c))} onBack={()=>window.history.back()}/></div>;
  }
  const sorted=[...candidates].sort((a,b)=>calcScore(b)-calcScore(a));
  return(
    <div className="content-wrap">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div><div style={{fontWeight:800,fontSize:17,color:'#1a1a2e'}}>다음 활동 후보</div><div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>총 {candidates.length}개 · 점수 높은 순</div></div>
        <Btn onClick={()=>setShowAdd(true)}>＋ 추가</Btn>
      </div>
      {!nick&&<div style={{background:'#FEF3C7',border:'1.5px solid #FDE68A',borderRadius:14,padding:'12px 16px',marginBottom:16,fontSize:13,color:'#92400E'}}>⚠️ 투표하려면 우측 상단에서 닉네임을 설정해주세요</div>}
      {sorted.length===0?<Empty emoji="📋" title="아직 후보가 없어요" sub="가고싶은 클래스를 추가해보세요!"/>
        :<div style={{display:'flex',flexDirection:'column',gap:12}}>{sorted.map((c,i)=><CandidateCard key={c.id} cand={c} onClick={()=>openDetail(c.id)} myVote={c.votes?.[nick]} rank={i<3&&calcScore(c)>0?i:null}/>)}</div>}
      {showAdd&&<AddCandidateModal onAdd={c=>onSave([...candidates,c])} onClose={()=>setShowAdd(false)}/>}
    </div>
  );
}

/* ── App ─────────────────────────────────────────────────────── */
function App(){
  const [tab,setTab]=useState('home');
  const [candidates,setCandidates]=useState([]);
  const [records,setRecords]=useState([]);
  const [confirmed,setConfirmed]=useState({});
  const [nick,setNick]=useState(getNick());
  const [loading,setLoading]=useState(true);
  const [showNickModal,setShowNickModal]=useState(!getNick());
  const [editNick,setEditNick]=useState(false);
  const [candModal,setCandModal]=useState(null);

  useEffect(()=>{
    async function init(){const data=await fbGet();setCandidates(data.candidates||[]);setRecords(data.records||[]);setConfirmed(data.confirmed||{});setLoading(false);}
    init();
    const unsub=fbListen(data=>{if(data.candidates)setCandidates(data.candidates);if(data.records)setRecords(data.records);if(data.confirmed)setConfirmed(data.confirmed);});
    return unsub;
  },[]);

  async function saveCands(data){setCandidates(data);await fbSet('candidates',data);}
  async function saveRecs(data){setRecords(data);await fbSet('records',data);}
  async function saveConf(data){setConfirmed(data);await fbSet('confirmed',data);}

  async function confirmClass(ym,candId){
    const newConf={...confirmed,[ym]:candId};await saveConf(newConf);
    const cand=candidates.find(c=>c.id===candId);if(!cand)return;
    const[y,m]=ym.split('-').map(Number);const d=nthWkday(y,m-1,3,2);const dateStr=d?toISO(d):'';
    const stubIdx=records.findIndex(r=>r.month===ym&&r.isStub);
    const hasReal=records.some(r=>r.month===ym&&!r.isStub);
    if(stubIdx>=0){
      const next=[...records];next[stubIdx]={...next[stubIdx],name:cand.name,cat:cand.cat||'',date:dateStr,price:cand.price||0,address:cand.address||'',naverUrl:cand.naverUrl||''};await saveRecs(next);
    } else if(!hasReal){
      const stub={id:uid(),month:ym,candId,name:cand.name,cat:cand.cat||'',date:dateStr,activity:'',price:cand.price||0,address:cand.address||'',naverUrl:cand.naverUrl||'',afterParties:[],photos:[],impressions:[],reviews:[],isStub:true,createdAt:Date.now()};
      await saveRecs([...records,stub]);
    }
  }

  function handleNickSave(v){setNick(v);setShowNickModal(false);setEditNick(false);}

  if(loading)return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#bbb',fontSize:14}}>불러오는 중...</div>;

  const TABS=[{id:'home',l:'🏠 홈'},{id:'records',l:'📖 다녀온'},{id:'candidates',l:'📋 다음 활동 후보'}];

  return(
    <div style={{minHeight:'100vh',background:'#F5F4EF'}}>
      <div className="nav-wrap">
        <div className="nav-inner">
          <span className="nav-title">🎨 원데이클래스 동아리</span>
          <button className="nav-nick" onClick={()=>setEditNick(true)}>{nick?<>👤 {nick} <span style={{fontSize:11,opacity:.7}}>수정</span></>:<span style={{color:'#F59E0B'}}>👤 닉네임 설정</span>}</button>
        </div>
        <div className="nav-tabs">{TABS.map(t=><button key={t.id} className={`nav-tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.l}</button>)}</div>
      </div>
      <div className="main">
        {tab==='home'&&<HomeTab candidates={candidates} records={records} confirmed={confirmed} onConfirm={confirmClass} nick={nick} onCandClick={c=>setCandModal(c)}/>}
        {tab==='records'&&<RecordsTab records={records} candidates={candidates} onSave={saveRecs} nick={nick}/>}
        {tab==='candidates'&&<CandidatesTab candidates={candidates} onSave={saveCands} nick={nick}/>}
      </div>
      {(showNickModal||editNick)&&<NicknameModal current={nick} onSave={handleNickSave} isFirst={showNickModal&&!editNick}/>}
      {candModal&&(
        <Modal title={candModal.name} onClose={()=>setCandModal(null)}>
          {!nick&&<div style={{background:'#FEF3C7',borderRadius:12,padding:'10px 14px',marginBottom:16,fontSize:13,color:'#92400E'}}>⚠️ 투표하려면 우측 상단에서 닉네임을 설정해주세요</div>}
          <CandidateDetail cand={candidates.find(c=>c.id===candModal.id)||candModal} nick={nick} inModal onUpdate={async u=>{await saveCands(candidates.map(c=>c.id===u.id?u:c));setCandModal(u);}} onBack={()=>setCandModal(null)}/>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
